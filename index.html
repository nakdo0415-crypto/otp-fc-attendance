<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OTP FC Attendance</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Firebase SDK (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;700;900&display=swap');
        body { font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; background-color: #f8fafc; }
        .animate-zoom-in { animation: zoomIn 0.2s ease-out; }
        @keyframes zoomIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
        button:active { transform: scale(0.95); }
        #loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        input[type="checkbox"] { width: 20px; height: 20px; border-radius: 6px; cursor: pointer; accent-color: #2563eb; }
    </style>
</head>
<body>
    <div id="loading-screen">
        <div class="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
        <p class="mt-4 font-bold text-slate-500 italic">데이터 동기화 중...</p>
    </div>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- 아이콘 세트 ---
        const Icon = {
            Users: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>,
            Trash: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>,
            Settings: () => <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33 1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82 1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>,
            Check: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>,
            Alert: () => <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#ef4444" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>,
            Sparkles: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>,
            Calendar: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        };

        // --- Firebase Configuration ---
        const config = {
            apiKey: "AIzaSyCAcQzliuWJTB8vPm9gb0vsyR8pIAx7YTw",
            authDomain: "otp-fc-check.firebaseapp.com",
            projectId: "otp-fc-check",
            storageBucket: "otp-fc-check.firebasestorage.app",
            messagingSenderId: "907414776392",
            appId: "1:907414776392:web:0a29a660bb956e5a40467d"
        };

        if (!firebase.apps.length) firebase.initializeApp(config);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const APP_ID = 'otp-fc-attendance';

        const getMemberCol = () => db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('members');
        const getSessionCol = () => db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('weekly_session');

        function App() {
            const [view, setView] = useState('attendance');
            const [members, setMembers] = useState([]);
            const [session, setSession] = useState([]);
            const [user, setUser] = useState(null);
            const [modal, setModal] = useState({ type: null, data: null });
            const [isPending, setIsPending] = useState(false);
            const [error, setError] = useState(null);

            const [bulkText, setBulkText] = useState('');
            const [newMemberName, setNewMemberName] = useState('');
            const [newMemberGender, setNewMemberGender] = useState('남성');
            const [isBulkMode, setIsBulkMode] = useState(false);
            const [selectedMemberIds, setSelectedMemberIds] = useState(new Set());

            // Functions
            const addMember = async () => {
                if (!newMemberName.trim() || isPending) return;
                setIsPending(true);
                try {
                    await getMemberCol().add({ 
                        name: newMemberName.trim(), 
                        gender: newMemberGender, 
                        type: 'regular', 
                        createdAt: new Date().toISOString() 
                    });
                    setNewMemberName('');
                } catch (e) { alert("추가 실패: " + e.message); }
                finally { setIsPending(false); }
            };

            const handleBulkAdd = async () => {
                if (!bulkText.trim() || isPending) return;
                const names = bulkText.split(/[\r\n\t,]+/).map(n => n.trim()).filter(n => n.length > 0);
                if (names.length === 0) return alert("이름을 입력하세요.");
                if (!confirm(`${names.length}명을 각각 따로 등록하시겠습니까?`)) return;

                setIsPending(true);
                try {
                    const batchSize = 400;
                    const membersRef = getMemberCol();
                    for (let i = 0; i < names.length; i += batchSize) {
                        const batch = db.batch();
                        const chunk = names.slice(i, i + batchSize);
                        chunk.forEach(name => {
                            const newDoc = membersRef.doc();
                            batch.set(newDoc, { name, gender: newMemberGender, type: 'regular', createdAt: new Date().toISOString() });
                        });
                        await batch.commit();
                    }
                    setBulkText(''); setIsBulkMode(false);
                    alert("일괄 등록 완료!");
                } catch (e) { alert("일괄 등록 실패"); }
                finally { setIsPending(false); }
            };

            const deleteMember = async (id, name) => {
                if (!confirm(`${name} 님을 명단에서 삭제하시겠습니까?`)) return;
                try {
                    await getMemberCol().doc(id).delete();
                } catch (e) { alert("삭제 실패: 권한이 없습니다."); }
            };

            const deleteSelected = async () => {
                if (selectedMemberIds.size === 0) return alert("삭제할 회원을 먼저 체크해주세요.");
                if (!confirm(`선택한 ${selectedMemberIds.size}명을 삭제하시겠습니까?`)) return;
                
                setIsPending(true);
                try {
                    const idsArray = Array.from(selectedMemberIds);
                    const membersRef = getMemberCol();
                    const batch = db.batch();
                    idsArray.forEach(id => batch.delete(membersRef.doc(id)));
                    await batch.commit();
                    setSelectedMemberIds(new Set());
                    alert("선택 삭제 완료.");
                } catch (e) { alert("삭제 실패"); }
                finally { setIsPending(false); }
            };

            const deleteAllMembers = async () => {
                if (members.length === 0) return alert("삭제할 명단이 없습니다.");
                if (!confirm("⚠️ 주의: 전체 명단을 모두 삭제하시겠습니까? 이 작업은 되돌릴 수 없습니다.")) return;

                setIsPending(true);
                try {
                    const membersRef = getMemberCol();
                    const snap = await membersRef.get();
                    const batch = db.batch();
                    snap.docs.forEach(doc => batch.delete(doc.ref));
                    await batch.commit();
                    alert("전체 삭제 완료.");
                } catch (e) { alert("전체 삭제 실패"); }
                finally { setIsPending(false); }
            };

            const cleanupDuplicates = async () => {
                if (!confirm("중복된 이름을 가진 회원을 정리하시겠습니까?")) return;
                setIsPending(true);
                try {
                    const seen = new Set();
                    const toDelete = [];
                    members.forEach(m => {
                        if (seen.has(m.name)) toDelete.push(m.id);
                        else seen.add(m.name);
                    });
                    if (toDelete.length === 0) {
                        alert("중복된 명단이 없습니다.");
                        setIsPending(false);
                        return;
                    }
                    const membersRef = getMemberCol();
                    const batch = db.batch();
                    toDelete.forEach(id => batch.delete(membersRef.doc(id)));
                    await batch.commit();
                    alert(`${toDelete.length}명의 중복 데이터를 정리했습니다.`);
                } catch (e) { alert("정리 실패"); }
                finally { setIsPending(false); }
            };

            const toggleSelect = (id) => {
                const next = new Set(selectedMemberIds);
                if (next.has(id)) next.delete(id);
                else next.add(id);
                setSelectedMemberIds(next);
            };

            const toggleAllSelect = () => {
                if (selectedMemberIds.size === members.length && members.length > 0) setSelectedMemberIds(new Set());
                else setSelectedMemberIds(new Set(members.map(m => m.id)));
            };

            const toggleParticipant = async (m) => {
                const existing = session.find(p => p.memberId === m.id);
                try {
                    if (existing) await getSessionCol().doc(existing.id).delete();
                    else await getSessionCol().add({ memberId: m.id, name: m.name, gender: m.gender, type: 'regular', checkedIn: false });
                } catch (e) { alert("오류가 발생했습니다."); }
            };

            useEffect(() => {
                const initAuth = async () => {
                    try {
                        await auth.signInAnonymously();
                        document.getElementById('loading-screen').style.display = 'none';
                    } catch (e) {
                        setError('auth');
                        document.getElementById('loading-screen').style.display = 'none';
                    }
                };
                initAuth();
                const unsub = auth.onAuthStateChanged(u => setUser(u));
                return () => unsub();
            }, []);

            useEffect(() => {
                if (!user) return;
                const unsubM = getMemberCol().onSnapshot(snap => {
                    setMembers(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                    setError(null);
                }, err => { if (err.code === 'permission-denied') setError('permission'); });
                const unsubS = getSessionCol().onSnapshot(snap => {
                    setSession(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                });
                return () => { unsubM(); unsubS(); };
            }, [user]);

            if (error) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-6 bg-slate-50 text-center">
                        <div className="bg-white p-10 rounded-[40px] shadow-2xl max-w-lg">
                            <div className="mb-6 flex justify-center"><Icon.Alert /></div>
                            <h2 className="text-2xl font-black mb-4">권한 설정 오류</h2>
                            <p className="text-slate-500 mb-8 leading-relaxed">Firebase 콘솔의 <b>Rules</b> 탭에서 <br/><code>allow read, write: if true;</code> 설정을 확인하세요.</p>
                            <button onClick={() => window.location.reload()} className="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold">새로고침</button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen pb-40">
                    <nav className="sticky top-0 bg-white/90 backdrop-blur-md border-b z-50 h-20 flex items-center px-4">
                        <div className="max-w-5xl mx-auto w-full flex justify-between items-center">
                            <div className="flex gap-2">
                                <button onClick={() => setView('attendance')} className={`px-6 py-2.5 rounded-2xl font-black transition-all ${view === 'attendance' ? 'bg-blue-600 text-white shadow-lg' : 'text-slate-400'}`}>출석</button>
                                <button onClick={() => setView('setup')} className={`px-6 py-2.5 rounded-2xl font-black transition-all ${view === 'setup' ? 'bg-green-600 text-white shadow-lg' : 'text-slate-400'}`}>선정</button>
                            </div>
                            <button onClick={() => setView('members')} className={`p-3 rounded-2xl transition-all ${view === 'members' ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-400'}`}><Icon.Settings /></button>
                        </div>
                    </nav>

                    <main className="p-4 sm:p-8 max-w-5xl mx-auto animate-zoom-in">
                        {view === 'attendance' && (
                            <div>
                                <header className="text-center mb-10">
                                    <h1 className="text-5xl font-black text-blue-900 italic tracking-tighter mb-1 uppercase">OTP FC</h1>
                                    <p className="text-[10px] font-bold text-slate-400 tracking-[0.4em] uppercase">Attendance Tracking</p>
                                </header>
                                {session.length === 0 ? (
                                    <div className="text-center py-20 bg-white rounded-[40px] border-2 border-dashed border-slate-100 shadow-sm">
                                        <p className="text-slate-400 font-bold mb-4">참여 명단이 비어있습니다.</p>
                                        <button onClick={() => setView('setup')} className="bg-blue-600 text-white px-10 py-4 rounded-3xl font-black shadow-xl">인원 선정하기</button>
                                    </div>
                                ) : (
                                    <div className="grid grid-cols-2 sm:grid-cols-5 gap-3">
                                        {session.sort((a,b) => a.name.localeCompare(b.name)).map(p => (
                                            <button key={p.id} onClick={() => p.checkedIn ? setModal({type:'cancel', data:p}) : setModal({type:'check', data:p})}
                                                className={`relative h-40 sm:h-52 rounded-[40px] flex flex-col items-center justify-center px-4 transition-all shadow-lg active:scale-90 ${p.checkedIn ? 'bg-blue-50/30 text-slate-300 border-2 border-blue-100' : 'bg-white border-2 border-blue-50 text-blue-900'}`}>
                                                {/* 한 줄 표시 및 글자 크기 최적화 (break-keep) */}
                                                <span className={`text-xl sm:text-2xl font-black w-full text-center leading-tight break-keep ${p.checkedIn ? 'text-blue-100' : ''}`}>
                                                    {p.name}
                                                </span>
                                                {p.checkedIn ? (
                                                    <span className="text-xs font-black text-blue-800 bg-blue-100 px-3 py-1 rounded-full mt-2">{p.checkInTime}</span>
                                                ) : (
                                                    /* 성별 가독성 강화: 색상 구분 및 폰트 크기 확대 */
                                                    <span className={`text-xs sm:text-sm font-black mt-1 uppercase ${p.gender === '남성' ? 'text-blue-600' : 'text-red-500'}`}>
                                                        {p.gender}
                                                    </span>
                                                )}
                                            </button>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}

                        {view === 'setup' && (
                            <div>
                                <h2 className="text-2xl font-black mb-8 flex items-center gap-2"><Icon.Calendar className="text-green-600" /> 참여 인원 선정</h2>
                                <div className="grid grid-cols-2 sm:grid-cols-5 gap-3">
                                    {members.sort((a,b)=>a.name.localeCompare(b.name)).map(m => {
                                        const isSel = session.some(p => p.memberId === m.id);
                                        return (
                                            <button key={m.id} onClick={() => toggleParticipant(m)} className={`p-4 h-24 rounded-2xl border-2 transition-all flex flex-col items-center justify-center relative active:scale-95 ${isSel ? 'border-green-500 bg-green-50 shadow-md' : 'bg-white border-slate-50 opacity-60'}`}>
                                                <span className="font-black text-lg w-full text-center break-keep">{m.name}</span>
                                                <span className={`text-xs font-bold ${m.gender === '남성' ? 'text-blue-600' : 'text-red-500'}`}>{m.gender}</span>
                                                {isSel && <div className="absolute top-2 right-2 text-green-600"><Icon.Check /></div>}
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        {view === 'members' && (
                            <div className="max-w-2xl mx-auto">
                                <div className="flex flex-col gap-6 mb-8">
                                    <div className="flex justify-between items-center">
                                        <h2 className="text-2xl font-black flex items-center gap-2"><Icon.Users className="text-blue-600" /> 명단 통합 관리</h2>
                                        <button onClick={() => setIsBulkMode(!isBulkMode)} className="bg-blue-100 text-blue-700 px-4 py-2 rounded-xl text-xs font-black">{isBulkMode ? '개별 모드' : '일괄 모드'}</button>
                                    </div>
                                    <div className="flex flex-wrap gap-2">
                                        <button onClick={cleanupDuplicates} disabled={isPending} className="flex-1 bg-purple-50 text-purple-600 px-4 py-3 rounded-2xl text-xs font-black flex items-center justify-center gap-2 border border-purple-100 hover:bg-purple-100">중복 정리</button>
                                        <button onClick={deleteSelected} disabled={isPending || selectedMemberIds.size === 0} className="flex-1 bg-orange-50 text-orange-600 px-4 py-3 rounded-2xl text-xs font-black flex items-center justify-center gap-2 border border-orange-100 hover:bg-orange-100">선택 삭제 ({selectedMemberIds.size})</button>
                                        <button onClick={deleteAllMembers} disabled={isPending || members.length === 0} className="flex-1 bg-red-50 text-red-600 px-4 py-3 rounded-2xl text-xs font-black flex items-center justify-center gap-2 border border-red-100 hover:bg-red-100">전체 삭제</button>
                                    </div>
                                </div>

                                <div className="bg-white p-6 rounded-[32px] border border-slate-100 shadow-sm mb-8">
                                    {isBulkMode ? (
                                        <div className="space-y-4">
                                            <textarea rows="10" placeholder="엑셀 명단을 그대로 붙여넣으세요..." className="w-full p-5 bg-slate-50 rounded-3xl font-bold outline-none resize-none border border-transparent focus:border-blue-500 transition-all custom-scrollbar" value={bulkText} onChange={e => setBulkText(e.target.value)} />
                                            <div className="flex gap-2">
                                                <select className="flex-1 p-4 bg-slate-50 rounded-2xl font-bold outline-none cursor-pointer" value={newMemberGender} onChange={e => setNewMemberGender(e.target.value)}><option>남성</option><option>여성</option></select>
                                                <button onClick={handleBulkAdd} disabled={isPending} className="bg-blue-600 text-white px-8 rounded-2xl font-black shadow-lg">일괄 등록</button>
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="flex flex-col gap-3">
                                            <input type="text" placeholder="이름 입력" className="p-4 bg-slate-50 rounded-2xl font-bold outline-none border border-transparent focus:border-blue-500 transition-all" value={newMemberName} onChange={e => setNewMemberName(e.target.value)} />
                                            <div className="flex gap-2">
                                                <select className="flex-1 p-4 bg-slate-50 rounded-2xl font-bold outline-none cursor-pointer" value={newMemberGender} onChange={e => setNewMemberGender(e.target.value)}><option>남성</option><option>여성</option></select>
                                                <button onClick={addMember} disabled={isPending} className="bg-blue-600 text-white px-8 rounded-2xl font-black shadow-lg">추가</button>
                                            </div>
                                        </div>
                                    )}
                                </div>

                                <div className="flex items-center gap-3 mb-4 px-3 py-4 bg-white rounded-2xl border border-slate-50 shadow-sm">
                                    <input type="checkbox" checked={members.length > 0 && selectedMemberIds.size === members.length} onChange={toggleAllSelect} />
                                    <span className="text-sm font-black text-slate-500 uppercase tracking-widest">전체 명단 ({members.length}명)</span>
                                </div>

                                <div className="space-y-2 max-h-[500px] overflow-y-auto pr-2 custom-scrollbar">
                                    {members.sort((a,b)=>a.name.localeCompare(b.name)).map(m => (
                                        <div key={m.id} className={`flex items-center justify-between p-4 bg-white rounded-2xl border transition-all ${selectedMemberIds.has(m.id) ? 'border-blue-500 bg-blue-50/10 shadow-md' : 'border-slate-50 shadow-sm'}`}>
                                            <div className="flex items-center gap-4 w-2/3">
                                                <input type="checkbox" checked={selectedMemberIds.has(m.id)} onChange={() => toggleSelect(m.id)} />
                                                <span className="font-bold text-lg text-slate-700 break-keep">{m.name} <small className={`ml-1 ${m.gender === '남성' ? 'text-blue-600' : 'text-red-500'}`}>{m.gender}</small></span>
                                            </div>
                                            <button onClick={() => deleteMember(m.id, m.name)} className="text-slate-200 hover:text-red-500 p-2"><Icon.Trash /></button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Stats Bar */}
                    <div className="fixed bottom-6 left-1/2 -translate-x-1/2 bg-white/90 backdrop-blur-2xl border border-white shadow-2xl rounded-full px-10 py-4 flex gap-10 items-center z-40 scale-90 sm:scale-100 border-t border-slate-50">
                        <div className="text-center"><p className="text-[8px] text-slate-400 font-black uppercase italic">Selected</p><p className="text-xl font-black text-slate-900">{session.length}</p></div>
                        <div className="w-px h-8 bg-slate-100" />
                        <div className="text-center"><p className="text-[8px] text-slate-400 font-black uppercase italic">Presence</p><p className="text-xl font-black text-green-600">{session.filter(p=>p.checkedIn).length}</p></div>
                    </div>

                    {/* Modals */}
                    {modal.type === 'check' && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-[100] flex items-center justify-center p-4">
                            <div className="bg-white rounded-[48px] w-full max-w-sm p-10 text-center animate-zoom-in shadow-2xl">
                                <h2 className="text-4xl font-black text-slate-900 mb-10 tracking-tighter break-keep">{modal.data.name} 님</h2>
                                <button onClick={async () => {
                                    try {
                                        await getSessionCol().doc(modal.data.id).update({
                                            checkedIn: true, checkInTime: new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' })
                                        });
                                        setModal({ type: null, data: null });
                                    } catch(e) { alert("출석 실패"); }
                                }} className="w-full bg-blue-600 text-white py-6 rounded-[32px] text-2xl font-black shadow-xl hover:bg-blue-700 transition-all">출석 확인</button>
                                <button onClick={() => setModal({type:null, data:null})} className="mt-4 text-slate-400 font-bold hover:text-slate-600">닫기</button>
                            </div>
                        </div>
                    )}

                    {modal.type === 'cancel' && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-[100] flex items-center justify-center p-4">
                            <div className="bg-white rounded-[48px] w-full max-w-sm p-10 text-center animate-zoom-in shadow-2xl">
                                <h2 className="text-3xl font-black mb-8 text-slate-900 tracking-tighter break-keep">{modal.data.name} 님</h2>
                                <p className="mb-10 text-slate-400 font-bold italic text-sm">출석 기록을 취소하시겠습니까?</p>
                                <button onClick={async () => {
                                    try {
                                        await getSessionCol().doc(modal.data.id).update({ checkedIn: false, checkInTime: null });
                                        setModal({ type: null, data: null });
                                    } catch(e) { alert("오류"); }
                                }} className="w-full bg-red-500 text-white py-6 rounded-[32px] text-xl font-black shadow-xl active:scale-95 transition-all">출석 취소하기</button>
                                <button onClick={() => setModal({type:null, data:null})} className="mt-4 text-slate-400 font-bold hover:text-slate-600">돌아가기</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

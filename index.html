                    setManualEndDate(endDateStr);
                    setTempRestCount(0);
                } else if (actionType === 'start_full') {
                    const endDateStr = calculateEndDate(targetMonth, 12);
                    setManualEndDate(endDateStr);
                    setTempRestCount(0);
                }
            };

            const processActionImmediate = async (actionType) => {
                if (!selectedMonthlyMember || !targetMonth) return;
                try {
                    const batch = db.batch();
                    const monthRef = getMonthlyCol().doc(targetMonth);
                    const memberRef = getMemberCol().doc(selectedMonthlyMember.id);
                    const memberId = selectedMonthlyMember.id;
                    
                    if (actionType === 'monthly_paid') {
                        batch.set(monthRef, { statuses: { [memberId]: 'paid' }, paymentDates: { [memberId]: paymentDateInput }, updatedAt: new Date().toISOString() }, { merge: true });
                        batch.update(monthRef, { [`reasons.${memberId}`]: firebase.firestore.FieldValue.delete() });
                        batch.update(memberRef, { membershipType: 'monthly', membershipStartDate: '', membershipEndDate: '', totalRestMonths: 0 });
                    } else if (actionType === 'start_half') {
                        const finalEndDate = manualEndDate || calculateEndDate(targetMonth, 6);
                        batch.update(memberRef, { membershipType: 'half_year', membershipStartDate: `${targetMonth}-01`, membershipEndDate: finalEndDate, totalRestMonths: 0 });
                        batch.set(monthRef, { paymentDates: { [memberId]: paymentDateInput }, updatedAt: new Date().toISOString() }, { merge: true });
                        batch.update(monthRef, { [`statuses.${memberId}`]: firebase.firestore.FieldValue.delete(), [`reasons.${memberId}`]: firebase.firestore.FieldValue.delete() });
                    } else if (actionType === 'start_full') {
                        const finalEndDate = manualEndDate || calculateEndDate(targetMonth, 12);
                        batch.update(memberRef, { membershipType: 'full_year', membershipStartDate: `${targetMonth}-01`, membershipEndDate: finalEndDate, totalRestMonths: 0 });
                        batch.set(monthRef, { paymentDates: { [memberId]: paymentDateInput }, updatedAt: new Date().toISOString() }, { merge: true });
                        batch.update(monthRef, { [`statuses.${memberId}`]: firebase.firestore.FieldValue.delete(), [`reasons.${memberId}`]: firebase.firestore.FieldValue.delete() });
                    } else if (actionType === 'rest') {
                        if (selectedMonthlyMember.membershipType === 'half_year' && (selectedMonthlyMember.totalRestMonths || 0) >= 3) {
                            return showAlert("알림", "반년납 회원은 휴식을 최대 3회까지만 사용할 수 있습니다.");
                        }
                        if (selectedMonthlyMember.membershipType === 'full_year' && (selectedMonthlyMember.totalRestMonths || 0) >= 6) {
                            return showAlert("알림", "1년납 회원은 휴식을 최대 6회까지만 사용할 수 있습니다.");
                        }

                        batch.set(monthRef, { statuses: { [memberId]: 'rest' }, paymentDates: { [memberId]: paymentDateInput }, updatedAt: new Date().toISOString() }, { merge: true });
                        batch.update(monthRef, { [`reasons.${memberId}`]: firebase.firestore.FieldValue.delete() });
                        
                        if (selectedMonthlyMember.membershipType === 'half_year' || selectedMonthlyMember.membershipType === 'full_year') {
                            const nextEndDate = extendEndDate(selectedMonthlyMember.membershipEndDate, 1);
                            batch.update(memberRef, { membershipEndDate: nextEndDate, totalRestMonths: firebase.firestore.FieldValue.increment(1) });
                        }
                    } else if (actionType === 'special_rest') {
                        batch.update(memberRef, {
                            isSpecialRest: true,
                            specialRestReason: specialRestReason || '특별 휴식',
                            specialRestStartMonth: targetMonth
                        });
                        batch.update(monthRef, { 
                            [`statuses.${memberId}`]: firebase.firestore.FieldValue.delete(), 
                            [`reasons.${memberId}`]: firebase.firestore.FieldValue.delete(), 
                            [`paymentDates.${memberId}`]: firebase.firestore.FieldValue.delete() 
                        });
                    } else if (actionType === 'cancel_special_rest') {
                        const startMonth = selectedMonthlyMember.specialRestStartMonth;
                        let monthsToExtend = 0;
                        if (startMonth) {
                            const [sy, sm] = startMonth.split('-').map(Number);
                            const [ty, tm] = targetMonth.split('-').map(Number);
                            monthsToExtend = (ty - sy) * 12 + (tm - sm);
                        }
                        if (monthsToExtend < 0) monthsToExtend = 0;

                        const updates = {
                            isSpecialRest: false,
                            specialRestReason: firebase.firestore.FieldValue.delete(),
                            specialRestStartMonth: firebase.firestore.FieldValue.delete()
                        };

                        if (monthsToExtend > 0 && (selectedMonthlyMember.membershipType === 'half_year' || selectedMonthlyMember.membershipType === 'full_year')) {
                            updates.membershipEndDate = extendEndDate(selectedMonthlyMember.membershipEndDate, monthsToExtend);
                        }
                        
                        batch.update(memberRef, updates);
                    } else if (actionType === 'clear') {
                        batch.update(monthRef, { [`statuses.${memberId}`]: firebase.firestore.FieldValue.delete(), [`reasons.${memberId}`]: firebase.firestore.FieldValue.delete(), [`paymentDates.${memberId}`]: firebase.firestore.FieldValue.delete() });
                    } else if (actionType === 'cancel_rest') {
                        batch.update(monthRef, { [`statuses.${memberId}`]: firebase.firestore.FieldValue.delete(), [`reasons.${memberId}`]: firebase.firestore.FieldValue.delete(), [`paymentDates.${memberId}`]: firebase.firestore.FieldValue.delete() });
                        const reason = monthlyReasons[memberId];
                        if (selectedMonthlyMember.membershipType === 'half_year' || selectedMonthlyMember.membershipType === 'full_year') {
                            const prevEndDate = extendEndDate(selectedMonthlyMember.membershipEndDate, -1);
                            const updatePayload = { membershipEndDate: prevEndDate };
                            if (!reason) { updatePayload.totalRestMonths = firebase.firestore.FieldValue.increment(-1); }
                            batch.update(memberRef, updatePayload);
                        }
                    } else if (actionType === 'end_membership') {
                        batch.update(memberRef, { membershipType: 'monthly', membershipStartDate: '', membershipEndDate: '', totalRestMonths: 0 });
                        batch.update(monthRef, { [`statuses.${memberId}`]: firebase.firestore.FieldValue.delete(), [`reasons.${memberId}`]: firebase.firestore.FieldValue.delete() });
                    } else if (actionType === 'update_payment_date') {
                        batch.set(monthRef, { paymentDates: { [memberId]: paymentDateInput }, updatedAt: new Date().toISOString() }, { merge: true });
                    } else if (actionType === 'update_longterm_info') {
                        batch.update(memberRef, { membershipEndDate: manualEndDate, totalRestMonths: tempRestCount });
                        batch.set(monthRef, { paymentDates: { [memberId]: paymentDateInput }, updatedAt: new Date().toISOString() }, { merge: true });
                    }

                    await batch.commit();
                    setSelectedMonthlyMember(null);
                    showAlert("성공", "상태가 성공적으로 반영되었습니다.");
                } catch(e) {
                    console.error(e);
                    showAlert("오류", "상태 처리에 실패했습니다.");
                }
            };

            const handleShowListModal = (listType) => {
                let filtered = [];
                let title = "";

                const sortedMembers = [...activeMembers].sort((a,b) => a.name.localeCompare(b.name));

                if (listType === 'unpaid') {
                    filtered = sortedMembers.filter(m => getMemberStatusType(m, monthlyStatuses, monthlyReasons, targetMonth) === 'unpaid');
                    title = `${targetMonth} 미납자 명단`;
                } else if (listType === 'half') {
                    filtered = sortedMembers.filter(m => {
                        if (STAFF_ROLES.includes(m.role)) return false;
                        const info = getMembershipStatus(m, targetMonth);
                        return info && info.active && info.type === '반년';
                    });
                    title = `${targetMonth} 반년납 명단`;
                } else if (listType === 'full') {
                    filtered = sortedMembers.filter(m => {
                        if (STAFF_ROLES.includes(m.role)) return false;
                        const info = getMembershipStatus(m, targetMonth);
                        return info && info.active && info.type === '1년';
                    });
                    title = `${targetMonth} 1년납 명단`;
                } else if (listType === 'rest_all') {
                    filtered = sortedMembers.filter(m => {
                        const t = getMemberStatusType(m, monthlyStatuses, monthlyReasons, targetMonth);
                        return t === 'rest' || t === 'special';
                    });
                    title = `${targetMonth} 휴식자 명단 (전체)`;
                }

                if (filtered.length === 0) {
                    return showAlert("알림", "해당하는 인원이 없습니다.");
                }

                const items = filtered.map(m => {
                    let tag = null;
                    let details = null;

                    const info = getMembershipStatus(m, targetMonth);
                    const statusType = getMemberStatusType(m, monthlyStatuses, monthlyReasons, targetMonth);

                    if (listType === 'half' || listType === 'full') {
                        if (statusType === 'rest' || statusType === 'special') tag = "휴식";
                        
                        if (info) {
                            details = `${info.endDateFormatted} 만료 | 잔여휴식 ${info.remainingRest}회`;
                            if (statusType === 'special') {
                                details += ` | 사유: ${m.specialRestReason || '특별휴식'}`;
                            } else if (statusType === 'rest') {
                                details += ` | 사유: ${info.type} 휴식`;
                            }
                        }
                    } else if (listType === 'rest_all') {
                        tag = '휴식';
                        if (statusType === 'special') {
                            details = `사유: ${m.specialRestReason || '특별휴식'}`;
                        } else if (info && info.active) {
                            details = `사유: ${info.type} 휴식`;
                        } else {
                            details = `사유: 일반 휴식`;
                        }
                    }
                    
                    if (monthlyPaymentDates[m.id]) {
                        details = details ? `${details} | 납부일: ${monthlyPaymentDates[m.id]}` : `납부일: ${monthlyPaymentDates[m.id]}`;
                    }
                    
                    return { id: m.id, name: m.name, tag, details };
                });

                setListModalData({ title, count: filtered.length, items });
                setCapturedImage(null); 
            };

            const fallbackCopy = (text) => {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                textArea.style.position = "fixed";
                textArea.style.top = "0";
                textArea.style.left = "0";
                textArea.style.opacity = "0";
                document.body.appendChild(textArea);
                
                if (navigator.userAgent.match(/ipad|iphone|mac/i)) {
                    const range = document.createRange();
                    range.selectNodeContents(textArea);
                    const selection = window.getSelection();
                    selection.removeAllRanges();
                    selection.addRange(range);
                    textArea.setSelectionRange(0, 999999);
                } else {
                    textArea.select();
                }

                try {
                    document.execCommand('copy');
                    setListModalData(null);
                    setCapturedImage(null);
                    showAlert("복사 완료", `클립보드에 복사되었습니다.\n\n카카오톡 등 원하는 곳에 붙여넣기 하세요!`);
                } catch (err) {
                    showAlert("오류", "복사에 실패했습니다. 권한을 확인해주세요.");
                } finally {
                    document.body.removeChild(textArea);
                }
            };

            const handleCopyFromModal = () => {
                if (!listModalData) return;
                const names = listModalData.items.map(item => {
                    let str = `- ${item.name}`;
                    if (item.tag) str += ` [${item.tag}]`;
                    if (item.details) str += ` (${item.details})`;
                    return str;
                }).join('\n');
                
                const textToCopy = `[ ${listModalData.title} ]\n총 ${listModalData.count}명\n\n${names}`;

                if (navigator.clipboard && window.isSecureContext) {
                    navigator.clipboard.writeText(textToCopy).then(() => {
                        setListModalData(null);
                        setCapturedImage(null);
                        showAlert("복사 완료", `클립보드에 복사되었습니다.\n\n카카오톡 등 원하는 곳에 붙여넣기 하세요!`);
                    }).catch(() => fallbackCopy(textToCopy));
                } else {
                    fallbackCopy(textToCopy);
                }
            };

            const handleCaptureImage = () => {
                setIsCapturing(true); 
                setTimeout(() => {
                    const target = document.getElementById('capture-area');
                    if (target) {
                        html2canvas(target, {
                            scale: 2, 
                            backgroundColor: '#ffffff',
                            useCORS: true 
                        }).then(canvas => {
                            const imageBase64 = canvas.toDataURL('image/png');
                            setCapturedImage(imageBase64); 
                            setIsCapturing(false); 
                        }).catch(err => {
                            console.error(err);
                            setIsCapturing(false);
                            showAlert("오류", "이미지 생성에 실패했습니다.");
                        });
                    } else {
                        setIsCapturing(false);
                    }
                }, 300);
            };

            const handleDownloadImage = () => {
                if (!capturedImage) return;
                const link = document.createElement('a');
                link.download = `${listModalData?.title || '명단'}.png`;
                link.href = capturedImage;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            useEffect(() => {
                const initAuth = async () => {
                    const timeout = setTimeout(() => {
                         const loader = document.getElementById('loading-screen');
                         if(loader) loader.style.opacity = '0';
                         setTimeout(() => { if(loader) loader.style.display = 'none'; }, 500);
                    }, 1000); 

                    try { 
                        await auth.signInAnonymously();
                    } catch (e) { 
                        console.error(e); 
                    } finally {
                        clearTimeout(timeout);
                        const loader = document.getElementById('loading-screen');
                        if(loader) {
                            loader.style.opacity = '0';
                            setTimeout(() => { loader.style.display = 'none'; }, 500);
                        }
                    }
                };
                initAuth();
                
                 const unsubAuth = auth.onAuthStateChanged(u => {
                    if (u) {
                        getMemberCol().onSnapshot(snap => setMembers(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
                        getSessionCol().onSnapshot(snap => setSessionData(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
                        getHistoryCol().onSnapshot(snap => setHistory(snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => b.date.localeCompare(a.date))));
                        getSettingsCol().doc('meeting_time').onSnapshot(doc => { 
                            if (doc.exists) {
                                const data = doc.data();
                                const dataDate = new Date(data.date);
                                const yesterday = new Date();
                                yesterday.setDate(yesterday.getDate() - 1);
                                if (dataDate < yesterday) {
                                    const nextSunday = getThisSunday();
                                    if (data.date !== nextSunday) {
                                        const newData = { ...data, date: nextSunday, managerId: "", managerName: "" };
                                        getSettingsCol().doc('meeting_time').set(newData);
                                        setMeetingTimes(newData);
                                    } else {
                                        setMeetingTimes(prev => ({...prev, ...data}));
                                    }
                                } else {
                                    setMeetingTimes(prev => ({...prev, ...data}));
                                }
                            }
                        });
                        
                        getTeamDraftsCol().orderBy('createdAt', 'desc').limit(1).onSnapshot(snap => {
                             if (!snap.empty) {
                                 const data = snap.docs[0].data();
                                 setTeamData(data);
                             } else {
                                 setTeamData(null);
                             }
                        });
                    }
                });
                return () => unsubAuth();
            }, []);
            
            useEffect(() => {
                if (view === 'members_list' && targetMonth) {
                    const unsubMonthly = getMonthlyCol().doc(targetMonth).onSnapshot(doc => {
                        if (doc.exists) {
                            const data = doc.data();
                            if (data.statuses) {
                                setMonthlyStatuses(data.statuses);
                                setMonthlyParticipants(Object.keys(data.statuses).filter(id => data.statuses[id] === 'paid'));
                            } else if (data.memberIds) {
                                const newStatuses = {};
                                data.memberIds.forEach(id => newStatuses[id] = 'paid');
                                setMonthlyStatuses(newStatuses);
                                setMonthlyParticipants(data.memberIds);
                            } else {
                                setMonthlyStatuses({});
                                setMonthlyParticipants([]);
                            }

                            if (data.reasons) {
                                setMonthlyReasons(data.reasons);
                            } else {
                                setMonthlyReasons({});
                            }

                            if (data.paymentDates) {
                                setMonthlyPaymentDates(data.paymentDates);
                            } else {
                                setMonthlyPaymentDates({});
                            }
                        } else {
                            setMonthlyStatuses({});
                            setMonthlyParticipants([]);
                            setMonthlyReasons({});
                            setMonthlyPaymentDates({});
                        }
                    });
                    return () => unsubMonthly();
                }
            }, [view, targetMonth]);
            
            useEffect(() => {
                if (meetingTimes.date) {
                    const [y, m] = meetingTimes.date.split('-');
                    const docKey = `${y}-${m}`;
                    const unsubSetupMonthly = getMonthlyCol().doc(docKey).onSnapshot(doc => {
                        if (doc.exists) {
                            const data = doc.data();
                            let validMembers = [];
                            if (data.statuses) {
                                validMembers = Object.keys(data.statuses).filter(id => data.statuses[id] === 'paid');
                            } else if (data.memberIds) {
                                validMembers = data.memberIds;
                            }
                            
                            activeMembers.forEach(member => {
                                const membershipInfo = getMembershipStatus(member, docKey);
                                if (STAFF_ROLES.includes(member.role)) {
                                     if (!validMembers.includes(member.id)) validMembers.push(member.id);
                                } 
                                else if (membershipInfo && membershipInfo.active) {
                                    if (!validMembers.includes(member.id)) {
                                        const status = data.statuses ? data.statuses[member.id] : null;
                                        if (status !== 'rest') {
                                            validMembers.push(member.id);
                                        }
                                    }
                                }
                            });
                            
                            setSetupTabMonthlyMembers(validMembers);
                        } else {
                            const autoMembers = activeMembers.filter(m => {
                                if (STAFF_ROLES.includes(m.role)) return true;
                                const info = getMembershipStatus(m, docKey);
                                return info && info.active;
                            }).map(m => m.id);
                            setSetupTabMonthlyMembers(autoMembers);
                        }
                    });
                    return () => unsubSetupMonthly();
                }
            }, [meetingTimes.date, members]);

            useEffect(() => {
                setModal({ type: null, data: null });
                setEditingMember(null);
                setEditingGuest(null);
                setIsGuestModalOpen(false);
                setIsAddMemberModalOpen(false);
                setIsBulkMode(false);
                setLockModalMode(null);
                setSelectedHistoryDetail(null);
                setIsEditingLocation(false);
                setEditLocationValue('');
                setAlertModal(prev => ({...prev, show: false}));
                setIsPasswordChangeModalOpen(false);
                setIsManagerSelectorOpen(false); 
                setSelectedMonthlyMember(null);
                setSpecialRestReason('');
                setHistoryEditTarget(null); 
                setListModalData(null); 
                setCapturedImage(null);
                setResigningMember(null);
            }, [view]);

            useEffect(() => {
                if (isMeetingOver && sessionData.length > 0) {
                    const unchecked = sessionData.filter(p => p.date === meetingTimes.date && !p.checkedIn && p.status !== '노쇼');
                    if (unchecked.length > 0) {
                        const batch = db.batch();
                        unchecked.forEach(p => batch.update(getSessionCol().doc(p.id), { status: '노쇼' }));
                        batch.commit().catch(err => console.error(err));
                    }
                }
            }, [isMeetingOver, sessionData, meetingTimes.date]);

            return (
                <div className="min-h-screen pb-40 text-slate-900">
                    {!isAppLocked && !isLoginModalOpen && (
                        <nav className="sticky top-0 bg-white/90 backdrop-blur-md border-b z-50 h-16 sm:h-20 flex items-center px-4 shadow-sm text-slate-900 transition-all">
                            <div className="max-w-5xl mx-auto w-full flex justify-between items-center text-left">
                                <div className="flex gap-1 sm:gap-2">
                                    {['attendance', 'setup', 'history_list', 'members_list', 'settings'].map((v) => (
                                        <button key={v} onClick={() => setView(v)} className={`px-3 sm:px-6 py-2 rounded-xl font-black text-xs sm:text-base transition-all ${view.includes(v.split('_')[0]) ? 'bg-blue-600 text-white shadow-lg' : 'text-slate-400 hover:text-slate-600'}`}>
                                            {v === 'attendance' ? '출석' : v === 'setup' ? '선정' : v === 'history_list' ? '기록' : v === 'members_list' ? '전체명단' : '설정'}
                                        </button>
                                    ))}
                                </div>
                                <div className="flex items-center gap-2 sm:gap-3">
                                    {loggedInManager && (
                                        <button onClick={() => setIsPasswordChangeModalOpen(true)} className="hidden sm:flex items-center gap-2 px-4 py-2 bg-slate-50 border border-slate-100 rounded-xl text-xs font-black text-slate-600 hover:bg-slate-100 transition-all">
                                            <Icon.ShieldCheck size={14} className="text-blue-600" />
                                            {loggedInManager.name} ({loggedInManager.role})
                                        </button>
                                    )}
                                    <button onClick={() => window.location.reload()} className="p-2.5 rounded-xl bg-slate-50 text-slate-400 hover:text-blue-600 transition-all shadow-none border-none"><Icon.Refresh size={18} /></button>
                                    <button onClick={handleLogout} className="p-2.5 rounded-xl bg-red-50 text-red-500 hover:bg-red-100 transition-all shadow-none border-none"><Icon.LogOut size={18} /></button>
                                    <button onClick={handleLockToggle} className="p-2.5 rounded-xl bg-slate-50 text-slate-400 hover:text-blue-600 border border-slate-100 transition-all shadow-none border-none"><Icon.Lock size={18} /></button>
                                </div>
                            </div>
                        </nav>
                    )}

                    <main className={`p-4 sm:p-8 max-w-6xl mx-auto animate-zoom-in ${isAppLocked ? 'pt-16 sm:pt-20' : ''}`}>
                        {view === 'attendance' && !isLoginModalOpen && (
                            <div className="max-w-5xl mx-auto">
                                <div className="flex flex-col items-center mb-8">
                                    <div className="flex flex-col items-center mb-6 drop-shadow-xl animate-zoom-in hover:scale-105 transition-transform duration-300">
                                        {!logoError ? (
                                            <img 
                                                src="KakaoTalk_20251203_102827701.png" 
                                                alt="OTP FC Emblem" 
                                                className="w-24 h-24 sm:w-32 sm:h-32 object-contain mb-2 mx-auto"
                                                onError={() => setLogoError(true)} 
                                            />
                                        ) : (
                                            <svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" className="mb-2 mx-auto">
                                                <path d="M50 95C50 95 85 80 90 30H10C15 80 50 95 50 95Z" fill="#db2777" stroke="#fbbf24" strokeWidth="3"/>
                                                <path d="M50 95C50 95 15 80 10 30H50V95Z" fill="#831843"/>
                                                <path d="M10 30H90V15C90 9.47715 85.5228 5 80 5H20C14.4772 5 10 9.47715 10 15V30Z" fill="white"/>
                                                <circle cx="50" cy="55" r="12" fill="white"/>
                                                <path d="M50 43V47M50 63V67M38 55H42M58 55H62" stroke="#db2777" strokeWidth="2" strokeLinecap="round"/>
                                                <circle cx="50" cy="55" r="8" stroke="#db2777" strokeWidth="2"/>
                                                <path d="M20 40L35 75" stroke="#fbbf24" strokeWidth="1" opacity="0.5"/>
                                                <path d="M80 40L65 75" stroke="#fbbf24" strokeWidth="1" opacity="0.5"/>
                                            </svg>
                                        )}
                                        <h1 className="text-4xl sm:text-5xl font-black text-[#db2777] tracking-tighter uppercase leading-none mt-1 drop-shadow-sm text-center">OTP FC</h1>
                                    </div>
                                    
                                    <CurrentTimeClock />
                                    
                                    <div className="bg-white px-5 py-2.5 rounded-full border border-slate-200 shadow-sm flex flex-wrap items-center justify-center gap-x-4 gap-y-1 text-xs sm:text-sm">
                                        <div className="flex items-center gap-1.5 font-bold text-slate-600">
                                            <Icon.Calendar size={14} className="text-slate-400"/>
                                            <span>{meetingTimes.date}</span>
                                        </div>
                                        <div className="w-px h-3 bg-slate-300"></div>
                                        <div className="flex items-center gap-1.5 font-black text-green-600">
                                            <Icon.Clock size={14} className="text-green-500"/>
                                            <span>{meetingTimes.start}~{meetingTimes.end}</span>
                                        </div>
                                        
                                        {meetingTimes.location && (
                                            <>
                                                <div className="w-px h-3 bg-slate-300 hidden sm:block"></div>
                                                <div className="flex items-center gap-1.5 font-bold text-blue-600">
                                                    <Icon.MapPin size={14} className="text-blue-500"/>
                                                    <span>{meetingTimes.location}</span>
                                                </div>
                                            </>
                                        )}
                                        
                                        <div className="w-px h-3 bg-slate-300 hidden sm:block"></div>
                                        <div className="flex items-center gap-1.5">
                                            {meetingTimes.managerName ? (
                                                <span className="text-slate-600 flex items-center gap-1.5 font-bold">
                                                    <Icon.ShieldCheck size={14} className="text-slate-400" /> 
                                                    {meetingTimes.managerName}
                                                </span>
                                            ) : (
                                                <button onClick={() => setIsManagerSelectorOpen(true)} className="text-[11px] text-blue-500 underline underline-offset-4 font-bold border-none">
                                                    관리자 미정
                                                </button>
                                            )}
                                        </div>
                                    </div>
                                    
                                    {activeTeamData && activeTeamData.meetingDate === meetingTimes.date && (
                                        <div className="mt-3 animate-fade-in flex items-center gap-1.5 text-[10px] text-green-600 font-bold bg-green-50 px-3 py-1 rounded-full border border-green-100">
                                            <div className="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse"></div>
                                            실시간 팀 연동됨
                                        </div>
                                    )}
                                </div>

                                {isMeetingOver && !isAppLocked && (
                                    <div className="mb-6 bg-purple-50 border-2 border-purple-200 p-6 rounded-[32px] flex flex-col sm:flex-row items-center justify-between gap-4 shadow-sm animate-zoom-in text-left">
                                        <div><p className="text-purple-700 font-black text-lg text-left">이번 모임이 종료되었습니다!</p><p className="text-purple-500 text-sm font-bold text-left">기록을 확정하면 출석하지 않은 분들은 <span className="text-red-600">'노쇼'</span>로 자동 체크됩니다.</p></div>
                                        <button onClick={saveAndResetCurrent} className="flex items-center gap-2 bg-purple-600 text-white px-8 py-4 rounded-2xl font-black shadow-xl hover:bg-purple-700 active:scale-95 transition-all shadow-rose-100 uppercase">Archive This Week</button>
                                    </div>
                                )}
                                
                                <div className="space-y-8">
                                    {sortedTeamKeys.map(teamKey => {
                                        const membersInTeam = groupedParticipants[teamKey];
                                        if (!membersInTeam || membersInTeam.length === 0) return null;
                                        
                                        const teamIndex = teamKey.charCodeAt(0) - 65;
                                        const teamBadgeColor = getTeamBadgeColor(teamIndex);

                                        return (
                                            <div key={teamKey} className="animate-fade-in">
                                                <div className="flex items-center gap-3 mb-4 px-2">
                                                    <span className={`px-5 py-2 rounded-2xl text-lg font-black shadow-md ${teamBadgeColor}`}>
                                                        {`TEAM ${teamKey}`}
                                                    </span>
                                                    <div className="h-1 bg-slate-100 flex-1 rounded-full"></div>
                                                    <span className="text-sm font-bold text-slate-400">{membersInTeam.length}명</span>
                                                </div>
                                                
                                                <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-2">
                                                    {membersInTeam.map((p) => {
                                                        const memberInfo = members.find(m => m.id === p.memberId);
                                                        const hasRole = memberInfo?.role && memberInfo.role !== '회원';
                                                        let baseColorClass = getTeamColorClass(teamIndex);
                                                        let cardStyle = `border-4 shadow-lg hover:shadow-xl hover:-translate-y-1 transition-all duration-200 ${baseColorClass}`;
                                                        let nameColor = "text-slate-900";
                                                        
                                                        const rank = activeParticipants.findIndex(ap => ap.id === p.id) + 1;
                                                        const limit = meetingTimes.maxLimit || 18;
                                                        const isWaiting = rank > limit;

                                                        if (isWaiting) {
                                                            cardStyle = "bg-slate-50 border-4 border-dashed border-orange-300 text-slate-400";
                                                            nameColor = "text-slate-500";
                                                        } else if (p.checkedIn) {
                                                            if (p.status === '지각') {
                                                                cardStyle = "bg-orange-50 border-orange-200 text-orange-900 border-4 shadow-inner opacity-90";
                                                                nameColor = "text-orange-900";
                                                            } else {
                                                                cardStyle = `border-4 shadow-inner opacity-50 scale-[0.98] ${baseColorClass}`; 
                                                                nameColor = "text-slate-900 line-through decoration-4 decoration-slate-900/30";
                                                            }
                                                        } else if (p.status === '노쇼') {
                                                            cardStyle = "bg-red-50 border-red-200 text-red-300 border-4 shadow-none";
                                                            nameColor = "text-red-300 line-through decoration-red-300/50";
                                                        }

                                                        return (
                                                            <button 
                                                                key={p.id} 
                                                                onClick={() => {
                                                                    if (isWaiting) {
                                                                        return showAlert("대기자 안내", `선착순(${limit}명) 마감되었습니다. 대기자는 출석 체크를 할 수 없습니다.`);
                                                                    }
                                                                    p.checkedIn ? setModal({type:'cancel', data:p}) : setModal({type:'check', data:p});
                                                                }}
                                                                className={`cursor-pointer relative h-40 sm:h-48 rounded-[32px] flex flex-col items-center justify-center p-0 overflow-hidden ${cardStyle} active:scale-95`}
                                                            >
                                                                <div className="absolute inset-0 flex items-center justify-center pointer-events-none overflow-hidden">
                                                                    <span className={`text-[8rem] font-black opacity-20 select-none leading-none ${getTeamNumberColor(teamIndex)}`}>
                                                                        {p.teamOrder}
                                                                    </span>
                                                                </div>

                                                                <div className="absolute top-3 w-full flex justify-between px-3 items-start pointer-events-none z-10">
                                                                    <div>
                                                                        {(p.checkedIn || p.status === '노쇼') && !isWaiting && (
                                                                            <span className={`text-[10px] font-black px-2 py-1 rounded-full shadow-sm ${
                                                                                p.status === '정상' ? 'bg-green-500 text-white' : 
                                                                                p.status === '지각' ? 'bg-orange-500 text-white' : 
                                                                                'bg-red-500 text-white'
                                                                            }`}>
                                                                                {p.status}
                                                                            </span>
                                                                        )}
                                                                        {isWaiting && (
                                                                            <span className="text-[10px] font-black px-2 py-1 rounded-full shadow-sm bg-orange-400 text-white">
                                                                                대기
                                                                            </span>
                                                                        )}
                                                                    </div>
                                                                </div>

                                                                <div className="relative z-10 flex flex-col items-center justify-center w-full h-full pb-2 pointer-events-none">
                                                                    <div className="flex gap-1 mb-1">
                                                                        {hasRole && <span className={`text-[9px] font-black px-1.5 py-0.5 rounded-md shadow-sm ${getRoleBadgeClass(memberInfo.role)}`}>{memberInfo.role}</span>}
                                                                        {p.isGuest && <span className="text-[9px] font-black px-1.5 py-0.5 rounded-md bg-purple-600 text-white shadow-sm uppercase">GUEST</span>}
                                                                    </div>
                                                                    <span className={`text-2xl sm:text-3xl font-black leading-tight break-keep text-center ${nameColor}`}>
                                                                        {p.name.replace('(G)', '')}
                                                                    </span>
                                                                    <span className={`text-[10px] font-bold uppercase tracking-widest mt-1 ${p.gender === '여성' ? 'text-pink-500' : 'text-blue-500/60'}`}>
                                                                        {p.gender}
                                                                    </span>
                                                                    {p.isGuest && p.inviterName !== '없음' && (
                                                                        <span className="text-[9px] font-bold text-slate-400 mt-0.5 text-center">
                                                                            by {p.inviterName}
                                                                        </span>
                                                                    )}
                                                                </div>
                                                                {p.checkedIn && !isWaiting && (
                                                                    <div className="absolute bottom-4 bg-white/80 backdrop-blur px-3 py-1 rounded-full shadow-sm z-10 pointer-events-none">
                                                                        <span className="text-xs font-black text-slate-600">{p.checkInTime}</span>
                                                                    </div>
                                                                )}
                                                            </button>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                                {activeParticipantsSorted.length === 0 && <div className="col-span-full py-20 text-slate-300 font-bold text-center">선정된 인원이 없습니다.</div>}
                            </div>
                        )}

                        {view === 'setup' && (
                            <div className="max-w-5xl mx-auto text-left">
                                <div className="bg-white p-6 sm:p-8 rounded-[40px] border border-slate-100 shadow-sm mb-8 text-left">
                                    <h3 className="text-sm font-black text-slate-400 mb-6 tracking-widest text-left uppercase">Next Meeting Schedule</h3>
                                    <div className="grid grid-cols-1 md:grid-cols-4 gap-6 items-end text-left">
                                        <div className="text-left"><label className="text-[10px] font-black text-slate-400 ml-2 text-left uppercase">Date</label><input type="date" className="w-full p-4 bg-slate-50 rounded-2xl font-black border border-transparent focus:border-blue-500 shadow-none outline-none" value={meetingTimes.date} onChange={e => updateMeetingTimeSettings({...meetingTimes, date: e.target.value})} /></div>
                                        <div className="text-left">
                                            <label className="text-[10px] font-black text-slate-400 ml-2 uppercase">Start</label>
                                            <div className="flex gap-2 text-xs">
                                                <select className="flex-1 p-4 bg-slate-50 rounded-2xl font-black outline-none border-none" value={meetingTimes.start.split(':')[0]} onChange={e => updateMeetingTimeSettings({...meetingTimes, start: `${e.target.value}:${meetingTimes.start.split(':')[1]}`})}>{hourOptions.map(h => <option key={h} value={h}>{h}시</option>)}</select>
                                                <select className="flex-1 p-4 bg-slate-50 rounded-2xl font-black outline-none border-none" value={meetingTimes.start.split(':')[1]} onChange={e => updateMeetingTimeSettings({...meetingTimes, start: `${meetingTimes.start.split(':')[0]}:${e.target.value}`})}>{minuteOptions.map(m => <option key={m} value={m}>{m}분</option>)}</select>
                                            </div>
                                        </div>
                                        <div className="text-left">
                                            <label className="text-[10px] font-black text-slate-400 ml-2 uppercase">End</label>
                                            <div className="flex gap-2 text-xs">
                                                <select className="flex-1 p-4 bg-slate-50 rounded-2xl font-black outline-none border-none" value={meetingTimes.end.split(':')[0]} onChange={e => updateMeetingTimeSettings({...meetingTimes, end: `${e.target.value}:${meetingTimes.end.split(':')[1]}`})}>{hourOptions.map(h => <option key={h} value={h}>{h}시</option>)}</select>
                                                <select className="flex-1 p-4 bg-slate-50 rounded-2xl font-black outline-none border-none" value={meetingTimes.end.split(':')[1]} onChange={e => updateMeetingTimeSettings({...meetingTimes, end: `${meetingTimes.end.split(':')[0]}:${e.target.value}`})}>{minuteOptions.map(m => <option key={m} value={m}>{m}분</option>)}</select>
                                            </div>
                                        </div>
                                        <div className="text-left">
                                            <label className="text-[10px] font-black text-slate-400 ml-2 uppercase">Limit</label>
                                            <input
                                                type="number"
                                                min="1"
                                                className="w-full p-4 bg-slate-50 rounded-2xl font-black border border-transparent focus:border-blue-500 shadow-none outline-none"
                                                value={meetingTimes.maxLimit || 18}
                                                onChange={e => updateMeetingTimeSettings({...meetingTimes, maxLimit: parseInt(e.target.value) || 18})}
                                            />
                                        </div>
                                        <div className="text-left">
                                            <label className="text-[10px] font-black text-slate-400 ml-1 uppercase">Manager</label>
                                            <div className="flex gap-2 text-xs">
                                                <select 
                                                    className="flex-1 p-4 bg-slate-50 rounded-2xl font-black text-slate-700 outline-none border-none" 
                                                    value={meetingTimes.managerId || ""} 
                                                    onChange={e => {
                                                        const target = members.find(m => m.id === e.target.value);
                                                        updateMeetingTimeSettings({...meetingTimes, managerId: e.target.value, managerName: target ? target.name : ""});
                                                    }}
                                                >
                                                    <option value="">담당자 선택 (전체)</option>
                                                    {activeMembers.sort((a,b)=>a.name.localeCompare(b.name)).map(m => (
                                                        <option key={m.id} value={m.id}>{m.name} ({m.role})</option>
                                                    ))}
                                                </select>
                                                <button 
                                                    onClick={registerCurrentAsManager}
                                                    className="px-6 bg-blue-600 text-white rounded-2xl font-black text-xs active:scale-95 transition-all shadow-lg shadow-blue-100 border-none"
                                                >
                                                    확인
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-4 gap-6 items-end mt-4 text-left">
                                        <div className="text-left md:col-span-2">
                                            <label className="text-[10px] font-black text-slate-400 ml-2 text-left uppercase">Location</label>
                                            <div className="relative"><input type="text" className="w-full p-4 pl-10 bg-slate-50 rounded-2xl font-black border border-transparent focus:border-blue-500 shadow-none outline-none" placeholder="모임 장소 입력" value={meetingTimes.location || ''} onChange={e => updateMeetingTimeSettings({...meetingTimes, location: e.target.value})} /><div className="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"><Icon.MapPin size={18} /></div></div>
                                        </div>
                                        <div className="md:col-span-2 flex justify-end gap-3 text-left">

                                                        <div className="mt-3 p-3 bg-white/50 rounded-xl border border-slate-200 text-[10px] flex flex-col gap-1 w-full text-slate-500">
                                                            <div className="flex justify-between items-center">
                                                                <span className="font-bold opacity-70">탈퇴일</span>
                                                                <span className="font-black">{m.resignDate || '-'}</span>
                                                            </div>
                                                            <div className="flex justify-between items-center">
                                                                <span className="font-bold opacity-70">사유</span>
                                                                <span className="font-black truncate max-w-[120px] text-right" title={m.resignReason}>{m.resignReason || '-'}</span>
                                                            </div>
                                                            {m.isForcedResign && (
                                                                <div className="mt-1 text-red-500 font-black text-right border-t border-slate-200 pt-1 flex justify-end gap-1 items-center">
                                                                    <Icon.Lock size={10} /> 6개월간 재가입 불가
                                                                </div>
                                                            )}
                                                        </div>
                                                    </div>
                                                ))}
                                                {resignedMembers.length === 0 && (
                                                    <div className="col-span-full py-20 text-center text-slate-400 font-bold bg-slate-50 rounded-[32px] border border-dashed border-slate-200">
                                                        탈퇴한 회원이 없습니다.
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    )}

                                    {/* 4-2. 월별 참여 관리 (신규 - 회비 납부 현황 및 설정) */}

                                        <div className="animate-fade-in">
                                            <div className="flex justify-center items-center gap-4 mb-4">

                                                    <p className="text-xs font-bold text-slate-400 uppercase tracking-widest">Fee Status</p>
                                                    <h2 className="text-2xl font-black text-slate-900">{targetMonth}</h2>
                                                </div>
                                                <button onClick={() => moveMonth(1)} className="p-2 rounded-full hover:bg-slate-100 text-slate-400 hover:text-slate-600"><Icon.ChevronRight /></button>
                                            </div>

                                                {['all', 'monthly', 'half', 'full', 'rest', 'special', 'unpaid'].map(cat => {
                                                    const label = { all: '전체', monthly: '월납', half: '반년', full: '1년', rest: '휴식', special: '특별', unpaid: '미납' }[cat];
                                                    const count = filterCounts[cat];
                                                    const isActive = filterCategory === cat;
                                                    let colorClass = 'bg-slate-100 text-slate-500';
                                                    if (isActive) {
                                                        if (cat === 'all') colorClass = 'bg-slate-800 text-white';
                                                        else if (cat === 'monthly') colorClass = 'bg-green-500 text-white';
                                                        else if (cat === 'half') colorClass = 'bg-blue-500 text-white';
                                                        else if (cat === 'full') colorClass = 'bg-purple-500 text-white';
                                                        else if (cat === 'rest') colorClass = 'bg-yellow-400 text-white';
                                                        else if (cat === 'special') colorClass = 'bg-indigo-500 text-white';
                                                        else if (cat === 'unpaid') colorClass = 'bg-red-500 text-white';
                                                    }
                                                    return (
                                                        <button 
                                                            key={cat} 
                                                            onClick={() => setFilterCategory(cat)}
                                                            className={`flex-shrink-0 px-3 py-1.5 rounded-full text-[10px] font-black transition-all ${colorClass}`}
                                                        >
                                                            {label} <span className="opacity-70 ml-0.5">({count})</span>
                                                        </button>
                                                    );
                                                })}

                                                <button onClick={() => handleShowListModal('full')} className="flex-shrink-0 px-4 py-2 rounded-full text-[10px] font-black transition-all bg-white border border-purple-200 text-purple-600 hover:bg-purple-50 shadow-sm active:scale-95">1년납</button>
                                                <button onClick={() => handleShowListModal('rest_all')} className="flex-shrink-0 px-4 py-2 rounded-full text-[10px] font-black transition-all bg-white border border-yellow-200 text-yellow-600 hover:bg-yellow-50 shadow-sm active:scale-95">휴식(전체)</button>

                                                    <div className="w-24 text-center">Status / Edit</div>
                                                </div>

                                                    const reason = monthlyReasons[m.id]; 
                                                    const membershipInfo = getMembershipStatus(m, targetMonth);
                                                    const isStaff = STAFF_ROLES.includes(m.role);
                                                    const isSpecialGlobal = m.isSpecialRest && targetMonth >= (m.specialRestStartMonth || '0000-00');
                                                    
                                                    let styleType = 'none';
                                                    let label = '미납';
                                                    let restReasonText = null;

                                                    if (isStaff) {
                                                        styleType = 'staff';
                                                        label = '운영진';
                                                    } else if (isSpecialGlobal) {
                                                        styleType = 'special';
                                                        label = '특별휴식';
                                                        restReasonText = m.specialRestReason;
                                                    } else if (membershipInfo && membershipInfo.active) {
                                                        if (status === 'rest') {
                                                            styleType = 'rest';
                                                            label = '휴식';
                                                            restReasonText = reason ? reason : `${membershipInfo.type} 휴식`;
                                                        } else {
                                                            styleType = membershipInfo.type === '반년' ? 'half' : 'full';
                                                            label = membershipInfo.type;
                                                        }
                                                    } else {
                                                        if (status === 'paid') {
                                                            styleType = 'monthly';
                                                            label = '월납';
                                                        } else if (status === 'rest') { 
                                                            styleType = 'rest';
                                                            label = '휴식';
                                                            restReasonText = reason ? reason : null;
                                                        }
                                                    }

                                                    let indexColor = 'text-slate-400';
                                                    let nameColor = 'text-slate-500';
                                                    let badgeClass = 'border-2 border-slate-200 bg-white text-slate-300';

                                                    if (styleType === 'monthly') {
                                                        containerClass = 'bg-white border-green-200 shadow-sm';
                                                        indexColor = 'text-green-600';
                                                        nameColor = 'text-slate-800';
                                                        badgeClass = 'bg-green-500 text-white shadow-md';
                                                    } else if (styleType === 'half') {
                                                        containerClass = 'bg-white border-blue-200 shadow-sm';
                                                        indexColor = 'text-blue-600';
                                                        nameColor = 'text-slate-800';
                                                        badgeClass = 'bg-blue-500 text-white shadow-md';
                                                    } else if (styleType === 'full') {
                                                        containerClass = 'bg-white border-purple-200 shadow-sm';
                                                        indexColor = 'text-purple-600';
                                                        nameColor = 'text-slate-800';
                                                        badgeClass = 'bg-purple-500 text-white shadow-md';
                                                    } else if (styleType === 'rest') {
                                                        containerClass = 'bg-yellow-50 border-yellow-200 shadow-sm';
                                                        indexColor = 'text-yellow-600';
                                                        nameColor = 'text-yellow-800';
                                                        badgeClass = 'bg-yellow-400 text-white shadow-md';
                                                    } else if (styleType === 'special') {
                                                        containerClass = 'bg-indigo-50 border-indigo-200 shadow-sm';

                                                        nameColor = 'text-indigo-800';
                                                        badgeClass = 'bg-indigo-500 text-white shadow-md';
                                                    } else if (styleType === 'staff') {
                                                        containerClass = 'bg-white border-orange-200 shadow-sm';
                                                        indexColor = 'text-orange-500';
                                                        nameColor = 'text-slate-900';
                                                        badgeClass = 'bg-orange-500 text-white shadow-md';
                                                    } else {
                                                        containerClass = 'bg-red-50 border-red-100 shadow-sm';
                                                        indexColor = 'text-red-400';
                                                        nameColor = 'text-slate-800';
                                                        badgeClass = 'bg-red-500 text-white shadow-md';
                                                    }

                                                    return (
                                                        <div key={m.id} className={`w-full flex items-center px-4 py-3 rounded-2xl border transition-all ${containerClass}`}>
                                                            <div className={`w-10 text-center text-sm font-bold ${indexColor}`}>{idx + 1}</div>
                                                            <button onClick={() => !isStaff && handleMemberClick(m)} className="flex-1 flex flex-col items-start pl-2 text-left" disabled={isStaff}>
                                                                <span className={`text-base font-black flex flex-wrap items-center gap-1.5 ${nameColor}`}>
                                                                    {m.name}
                                                                    {membershipInfo && membershipInfo.active && (
                                                                        <span className={`text-[9px] font-normal px-1.5 py-0.5 rounded-md border ${
                                                                            membershipInfo.type === '반년' ? 'bg-blue-50 text-blue-600 border-blue-100' : 'bg-purple-50 text-purple-600 border-purple-100'
                                                                        }`}>
                                                                            <b className="font-bold">{membershipInfo.endDateFormatted} 만료</b> <span className="opacity-50">|</span> 잔여휴식 <b className="font-bold">{membershipInfo.remainingRest}회</b>
                                                                        </span>
                                                                    )}
                                                                    {restReasonText && (
                                                                        <span className={`text-[9px] font-normal px-1.5 py-0.5 rounded-md border ${styleType === 'special' ? 'bg-indigo-100 text-indigo-700 border-indigo-200' : 'bg-yellow-50 text-yellow-700 border-yellow-200'}`}>
                                                                            📝 {restReasonText}
                                                                        </span>
                                                                    )}
                                                                    {monthlyPaymentDates[m.id] && (styleType === 'monthly' || styleType === 'rest' || styleType === 'half' || styleType === 'full') && (
                                                                        <span className="text-[9px] font-normal px-1.5 py-0.5 rounded-md bg-emerald-50 text-emerald-700 border border-emerald-200">
                                                                            💳 {monthlyPaymentDates[m.id]} 납부
                                                                        </span>
                                                                    )}
                                                                </span>
                                                                <span className="text-[10px] text-slate-400 font-bold">{m.level}단 / {m.position} / {m.gender === '남성' ? 'M' : 'F'}</span>
                                                            </button>
                                                            <button onClick={() => !isStaff && handleMemberClick(m)} className="w-24 flex justify-center" disabled={isStaff}>
                                                                {styleType !== 'none' ? (
                                                                    <div className={`w-16 h-8 rounded-lg flex items-center justify-center text-[10px] font-black ${badgeClass}`}>{label}</div>
                                                                ) : (
                                                                    <div className="w-16 h-8 rounded-lg border-2 border-red-100 bg-red-50 text-red-500 flex items-center justify-center text-[10px] font-black shadow-sm">미납</div>
                                                                )}
                                                            </button>
                                                        </div>
                                                    );
                                                })}
                                                {filteredMonthlyMembers.length === 0 && (
                                                    <div className="py-20 text-center text-slate-400 font-bold bg-slate-50 rounded-[32px] border border-dashed border-slate-200">
                                                        해당하는 회원이 없습니다.
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                            <div className="max-w-xl mx-auto pb-24 text-left animate-zoom-in">
                                <div className="bg-white p-8 rounded-[48px] shadow-sm border border-slate-100 text-center">
                                    <h2 className="text-3xl font-black text-slate-900 mb-8 tracking-tighter uppercase flex items-center justify-center gap-3">
                                        <Icon.Settings size={32} className="text-slate-300" />
                                        Settings
                                    </h2>
                                    
                                    <div className="mb-10">
                                        <h3 className="text-lg font-black text-slate-700 mb-4 flex items-center justify-center gap-2">
                                            <span className="bg-blue-100 text-blue-600 p-2 rounded-xl"><Icon.Upload size={20}/></span>
                                            폰트 파일 업로드
                                        </h3>
                                        <p className="text-xs text-slate-400 mb-6 leading-relaxed">
                                            .ttf, .otf, .woff 파일을 드래그하거나<br/>클릭하여 업로드하면 <b>'Esamanru'</b> 폰트로 즉시 적용됩니다.<br/>(새로고침 시 초기화됩니다)
                                        </p>
                                        
                                        <div className="relative group">
                                            <input 
                                                type="file" 
                                                accept=".ttf,.otf,.woff,.woff2" 
                                                multiple 
                                                className="hidden" 
                                                id="font-upload"
                                                onChange={handleFontUpload} 
                                            />
                                            <label 
                                                htmlFor="font-upload" 
                                                className="block w-full h-40 border-4 border-dashed border-slate-100 rounded-[32px] flex flex-col items-center justify-center cursor-pointer hover:border-blue-200 hover:bg-blue-50 transition-all group-hover:scale-[1.02] active:scale-95"
                                            >
                                                <div className="w-16 h-16 bg-white rounded-full shadow-lg flex items-center justify-center mb-3 text-blue-500">
                                                    <Icon.Upload size={32}/>
                                                </div>
                                                <span className="font-black text-slate-400 text-sm">Click to Upload Font</span>
                                            </label>
                                        </div>
                                    </div>

                                    {customFonts.length > 0 && (
                                        <div className="text-left bg-slate-50 p-6 rounded-3xl">
                                            <h4 className="font-bold text-slate-500 text-xs mb-3 uppercase tracking-wider">Applied Fonts</h4>
                                            <ul className="space-y-2">
                                                {customFonts.map((fontName, idx) => (
                                                    <li key={idx} className="flex items-center gap-2 text-sm font-black text-blue-600">
                                                        <Icon.CheckCircle size={16} className="text-green-500"/>
                                                        {fontName}
                                                    </li>
                                                ))}
                                            </ul>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                    </main>

                    {isLoginModalOpen && (
                        <div className="fixed inset-0 bg-slate-900/90 backdrop-blur-xl z-[9000] flex items-center justify-center p-4">

                                <div className="w-20 h-20 bg-blue-600 rounded-3xl flex items-center justify-center mx-auto mb-8 shadow-xl shadow-blue-100 text-white"><Icon.ShieldCheck size={40} /></div>

                                <div className="space-y-6 mb-8 text-left">
                                    <div className="flex flex-col gap-2">
                                        <label className="text-[10px] font-black text-slate-400 ml-1 uppercase">Select Manager</label>

    <style>

        body { 
            font-family: 'Esamanru', 'Pretendard', sans-serif;

        .animate-zoom-in { animation: zoomIn 0.2s ease-out; }

        button:active { transform: scale(0.95); opacity: 0.8; }
        
        #loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; transition: opacity 0.5s; }

        .safe-pt { padding-top: env(safe-area-inset-top); }

<body>
    <div id="loading-screen">
        <div class="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
        <p class="mt-4 font-bold text-slate-500 italic">서버 연결 중...</p>
    </div>
    <div id="root"></div>

    <script type="text/babel">
        // --- 1. Global Setup ---
        const { useState, useEffect, useRef, useMemo } = React;
        
        const STAFF_ROLES = ['회장', '매니저', '총무', '부총무'];
        const POSITIONS = ['ALL', '피보', '아라', '픽소'];

        const firebaseConfig = {
            apiKey: "AIzaSyCAcQzliuWJTB8vPm9gb0vsyR8pIAx7YTw",
            authDomain: "otp-fc-check.firebaseapp.com",
            projectId: "otp-fc-check",
            storageBucket: "otp-fc-check.firebasestorage.app",
            messagingSenderId: "907414776392",
            appId: "1:907414776392:web:0a29a660bb956e5a40467d"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const APP_ID = 'otp-fc-attendance';

        // Collection Helpers
        const getCol = (name) => db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection(name);
        const getTeamDraftsCol = () => db.collection('artifacts').doc('otp-fc-attendance').collection('public').doc('data').collection('team_drafts');
        const getMonthlyCol = () => db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('monthly_checks');
        const getSessionCol = () => getCol('weekly_session');
        const getHistoryCol = () => getCol('history');
        const getMemberCol = () => getCol('members');
        const getSettingsCol = () => getCol('settings');

        // Helper Functions
        const getThisSunday = () => {
            const now = new Date();
            const d = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 12, 0, 0);
            const day = d.getDay(); 
            const diff = (day === 0) ? 0 : 7 - day;
            d.setDate(d.getDate() + diff);
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const date = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${date}`;
        };

        const getNextSundayFromDate = (dateStr) => {
            let d;
            if (dateStr) {
                const parts = dateStr.split('-');
                d = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]), 12, 0, 0);
            } else {
                d = new Date();
                d.setHours(12, 0, 0, 0);
            }
            const day = d.getDay(); 
            const diff = (day === 0) ? 7 : 7 - day; 
            d.setDate(d.getDate() + diff);
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const date = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${date}`;
        };

        const getPosColorClass = (pos) => {
            if (!pos) return 'bg-slate-50 text-slate-400 border-slate-100';
            const p = String(pos).toLowerCase();
            if (p.includes('피보')) return 'bg-red-50 text-red-500 border-red-100';
            if (p.includes('아라')) return 'bg-green-50 text-green-600 border-green-100';
            if (p.includes('픽소')) return 'bg-blue-50 text-blue-500 border-blue-100';
            if (p.includes('골레이로')) return 'bg-purple-50 text-purple-600 border-purple-100';
            return 'bg-yellow-50 text-yellow-600 border-yellow-100';
        };

        const getGenderPastelClass = (gender) => {
            return gender === '남성' ? 'bg-[#E1F0FF] text-[#2563EB]' : 'bg-[#FFE5ED] text-[#DB2777]';
        };

        const getRoleBadgeClass = (role) => {
            switch(role) {
                case '회장': return 'bg-slate-900 text-white';
                case '매니저': return 'bg-blue-600 text-white';
                case '총무': return 'bg-green-600 text-white';
                case '부총무': return 'bg-green-100 text-green-700';
                default: return 'bg-slate-100 text-slate-400';
            }
        };

        const getTeamName = (index) => String.fromCharCode(65 + index);
        
        // 팀별 배경 숫자 색상
        const getTeamNumberColor = (index) => [
            'text-pink-500',      // TEAM 1
            'text-sky-400',       // TEAM 2
            'text-lime-500',      // TEAM 3
            'text-yellow-400',    // TEAM 4
            'text-blue-500',      // TEAM 5
            'text-red-500'        // TEAM 6
        ][index] || 'text-slate-300';
        
        // 조끼 색상 반영
        const getTeamColorClass = (index) => {
            const styles = [
                'bg-pink-50 border-pink-300 text-pink-900', 
                'bg-sky-50 border-sky-300 text-sky-900',    
                'bg-lime-50 border-lime-400 text-lime-900', 
                'bg-yellow-50 border-yellow-300 text-yellow-900', 
                'bg-blue-50 border-blue-300 text-blue-900', 
                'bg-red-50 border-red-300 text-red-900'     
            ];
            return styles[index] || 'bg-slate-50 border-slate-200 text-slate-900';
        };

        const getTeamBadgeColor = (index) => {
            const styles = [
                'bg-pink-500 text-white',       
                'bg-[#38bdf8] text-white',      
                'bg-[#a3e635] text-slate-900',  
                'bg-[#facc15] text-slate-900',  
                'bg-blue-600 text-white',       
                'bg-red-500 text-white'         
            ];
            return styles[index] || 'bg-slate-500 text-white';
        };

        const formatBirth = (birth) => {
            if (!birth) return '생일미입력';
            const clean = String(birth).replace(/[^0-9]/g, '');
            return clean.length === 8 ? `${clean.substring(0,4)}-${clean.substring(4,6)}-${clean.substring(6,8)}` : birth;
        };

        const getMembershipStatus = (member, targetMonthStr) => {
            if (!member.membershipType || member.membershipType === 'monthly' || !member.membershipEndDate) return null;
            const end = new Date(member.membershipEndDate);
            const endMonth = new Date(end.getFullYear(), end.getMonth(), 1);
            const [y, m] = targetMonthStr.split('-').map(Number);
            const current = new Date(y, m - 1, 1);
            if (current > endMonth) return { active: false, msg: '만료됨', type: member.membershipType === 'half_year' ? '반년' : '1년' };
            let monthsRemaining = (endMonth.getFullYear() - current.getFullYear()) * 12 + (endMonth.getMonth() - current.getMonth()) + 1;
            const maxRest = member.membershipType === 'half_year' ? 3 : 6;
            const usedRest = member.totalRestMonths || 0;
            const remainingRest = maxRest - usedRest;
            const year = end.getFullYear().toString().slice(2);
            const month = String(end.getMonth() + 1).padStart(2, '0');
            const day = String(end.getDate()).padStart(2, '0');
            const endDateFormatted = `${year}.${month}.${day}`;
            return { active: true, remaining: monthsRemaining, type: member.membershipType === 'half_year' ? '반년' : '1년', endDate: member.membershipEndDate, endDateFormatted, maxRest, usedRest, remainingRest };
        };

        const getMemberStatusType = (member, statuses, reasons, targetMonthStr) => {
            if (STAFF_ROLES.includes(member.role)) return 'staff';
            const status = statuses[member.id];
            const reason = reasons[member.id];
            const membershipInfo = getMembershipStatus(member, targetMonthStr);
            if (membershipInfo && membershipInfo.active) {
                if (status === 'rest') return reason ? 'special' : 'rest';
                return membershipInfo.type === '반년' ? 'half' : 'full';
            }
            if (status === 'paid') return 'monthly';
            if (status === 'rest') return reason ? 'special' : 'rest';
            return 'unpaid';
        };

            Trash: ({size=18, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>,

            Clock: ({size=20, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,

            Edit2: ({size=14, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg>
        };

        const CurrentTimeClock = () => {
            const [time, setTime] = useState(new Date());
            useEffect(() => {
                const timer = setInterval(() => {
                    setTime(new Date());
                }, 1000);
                return () => clearInterval(timer);
            }, []);

            return (
                <span className="text-xl sm:text-2xl font-bold text-slate-400 tabular-nums mb-6">
                    {time.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false })}
                </span>
            );
        };

        function App() {
            const [view, setView] = useState(() => sessionStorage.getItem('otp_view') || 'attendance');
            const [logoError, setLogoError] = useState(false); 
            const [customLogo, setCustomLogo] = useState(() => localStorage.getItem(APP_ID + '_custom_logo') || null);
            const [members, setMembers] = useState([]);
            const [sessionData, setSessionData] = useState([]);
            const [history, setHistory] = useState([]);
            const [selectedHistoryDetail, setSelectedHistoryDetail] = useState(null); 
            const [historySortKey, setHistorySortKey] = useState('time'); 
            const [historySortOrder, setHistorySortOrder] = useState('asc'); 
            const [meetingTimes, setMeetingTimes] = useState({ 
                date: getThisSunday(), 
                start: "08:00", 
                end: "10:00", 
                location: "", 
                managerId: "", 
                managerName: "",
                maxLimit: 18 // Default limit
            });
            const [currentTime, setCurrentTime] = useState(new Date());
            const [isAppLocked, setIsAppLocked] = useState(false);
            const [lockPassword, setLockPassword] = useState('');
            const [lockModalMode, setLockModalMode] = useState(null);
            const [tempPassword, setTempPassword] = useState('');
            const [modal, setModal] = useState({ type: null, data: null });
            const [alertModal, setAlertModal] = useState({ show: false, title: '', content: '', type: 'info', onConfirm: null });
            const [selectedMonthlyMember, setSelectedMonthlyMember] = useState(null); 
            const [manualEndDate, setManualEndDate] = useState(''); 
            const [specialRestReason, setSpecialRestReason] = useState(''); 
            const [filterCategory, setFilterCategory] = useState('all'); 
            const [historyEditTarget, setHistoryEditTarget] = useState(null); 
            const [listModalData, setListModalData] = useState(null); 
            const [isCapturing, setIsCapturing] = useState(false); 
            const [capturedImage, setCapturedImage] = useState(null); 
            const [withdrawModal, setWithdrawModal] = useState({ show: false, member: null, date: '', reason: '', isForced: false }); 

            const [teamData, setTeamData] = useState(null);
            const [localTeamData, setLocalTeamData] = useState(null);

            const [newMember, setNewMember] = useState({ 
                name: '', birth: '', gender: '남성', position: 'all', level: '1', role: '회원',
                coupleId: '', isEarlyBirth: false 
            });
            const [editingMember, setEditingMember] = useState(null);
            const [isBulkMode, setIsBulkMode] = useState(false);
            const [bulkPasteText, setBulkPasteText] = useState('');
            const [isPending, setIsPending] = useState(false);

            const [isGuestModalOpen, setIsGuestModalOpen] = useState(false);
            const [newGuest, setNewGuest] = useState({ name: '', gender: '남성', inviterId: '', inviterName: '', level: '1' });
            
            const [loggedInManager, setLoggedInManager] = useState(() => {
                try {
                    const stored = localStorage.getItem('otp_attendance_manager');
                    return stored ? JSON.parse(stored) : null;
                } catch (e) {
                    return null;
                }
            });
            const [isLoginModalOpen, setIsLoginModalOpen] = useState(!loggedInManager);
            
            const [loginForm, setLoginForm] = useState({ name: '', password: '' });
            const [isPasswordChangeModalOpen, setIsPasswordChangeModalOpen] = useState(false);
            const [passwordForm, setPasswordForm] = useState({ current: '', next: '', confirm: '' });
            const [isManagerSelectorOpen, setIsManagerSelectorOpen] = useState(false);

            const [customFonts, setCustomFonts] = useState([]);

            const [memberSubTab, setMemberSubTab] = useState(() => sessionStorage.getItem('otp_sub_tab') || 'directory'); 

            const [targetMonth, setTargetMonth] = useState(() => {
                const stored = sessionStorage.getItem('otp_target_month');
                if (stored) return stored;
                const now = new Date();
                return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
            });
            const [monthlyStatuses, setMonthlyStatuses] = useState({}); 
            const [monthlyParticipants, setMonthlyParticipants] = useState([]); 
            const [monthlyReasons, setMonthlyReasons] = useState({}); 
            const [setupTabMonthlyMembers, setSetupTabMonthlyMembers] = useState([]);

            const hourOptions = useMemo(() => Array.from({ length: 24 }, (_, i) => String(i).padStart(2, '0')), []);
            const minuteOptions = useMemo(() => Array.from({ length: 12 }, (_, i) => String(i * 5).padStart(2, '0')), []);

            const activeMembers = useMemo(() => members.filter(m => m.status !== 'withdrawn'), [members]);
            const withdrawnMembers = useMemo(() => members.filter(m => m.status === 'withdrawn'), [members]);

            const managers = useMemo(() => {
                return activeMembers.filter(m => STAFF_ROLES.includes(m.role)).sort((a,b) => a.name.localeCompare(b.name));
            }, [activeMembers]);

            useEffect(() => { sessionStorage.setItem('otp_view', view); }, [view]);
            useEffect(() => { sessionStorage.setItem('otp_sub_tab', memberSubTab); }, [memberSubTab]);
            useEffect(() => { sessionStorage.setItem('otp_target_month', targetMonth); }, [targetMonth]);

            const activeParticipants = useMemo(() => {
                const list = sessionData.filter(p => p.date === meetingTimes.date);
                return list.sort((a,b) => {
                    const timeA = a.createdAt || '';
                    const timeB = b.createdAt || '';
                    if (timeA && timeB) return timeA.localeCompare(timeB);
                    return a.name.localeCompare(b.name);
                });
            }, [sessionData, meetingTimes.date]);

            const activeTeamData = useMemo(() => {
                const serverTime = teamData ? new Date(teamData.createdAt).getTime() : 0;
                const localTime = localTeamData ? new Date(localTeamData.updatedAt).getTime() : 0;
                if (localTeamData && localTime > serverTime) { return localTeamData; }
                if (teamData) { return teamData; }
                return null;
            }, [localTeamData, teamData, meetingTimes.date]);

            const groupedTeams = useMemo(() => {
                const groups = []; 
                const assignedMemberIds = new Set();
                if (activeTeamData && activeTeamData.teams) {
                    activeTeamData.teams.forEach((t, idx) => {
                        const teamName = getTeamName(idx);
                        const teamMembers = [];
                        t.members.forEach(tm => {
                            const participant = activeParticipants.find(p => p.memberId === (tm.memberId || tm.id));
                            if (participant) {
                                teamMembers.push({ ...participant, teamOrder: t.members.indexOf(tm) + 1 });
                                assignedMemberIds.add(participant.id);
                            }
                        });
                        if (teamMembers.length > 0) {
                            groups.push({ teamName, members: teamMembers });
                        }
                    });
                }
                return groups;
            }, [activeParticipants, activeTeamData]);

            const sortedTeamKeys = useMemo(() => {
                return groupedTeams.map(g => g.teamName);
            }, [groupedTeams]);
            
            const groupedParticipants = useMemo(() => {
                const map = {};
                groupedTeams.forEach(g => {
                    map[g.teamName] = g.members;
                });
                return map;
            }, [groupedTeams]);

            const activeParticipantsSorted = useMemo(() => [...activeParticipants].sort((a,b) => a.name.localeCompare(b.name)), [activeParticipants]);

            const isMeetingOver = useMemo(() => {
                const now = new Date();
                const meetingEndTime = new Date(`${meetingTimes.date}T${meetingTimes.end}`);
                return now >= meetingEndTime;
            }, [meetingTimes]);

            const sortedHistoryRecords = useMemo(() => {
                if (!selectedHistoryDetail || !selectedHistoryDetail.records) return [];
                const list = selectedHistoryDetail.records.map((r, index) => ({ ...r, originalIndex: index }));
                if (historySortKey === 'time') {
                    return list.sort((a, b) => (a.timestamp || '99:99:99').localeCompare(b.timestamp || '99:99:99'));
                }
                if (historySortKey === 'status') {
                    const order = { '정상': 1, '지각': 2, '노쇼': 3, '미출석': 4 };
                    return list.sort((a, b) => {
                        const statusA = order[a.status] || 9;
                        const statusB = order[b.status] || 9;
                        let diff = statusA - statusB;
                        if (historySortOrder === 'desc') diff = statusB - statusA;
                        if (diff !== 0) return diff;
                        return (a.timestamp || '99:99:99').localeCompare(b.timestamp || '99:99:99');
                    });
                }
                return list;
            }, [selectedHistoryDetail, historySortKey, historySortOrder]);

            const footerStats = useMemo(() => {
                let label = "TOTAL"; 
                let count = activeMembers.length;
                if (view === 'setup') {
                    const m = meetingTimes.date ? parseInt(meetingTimes.date.split('-')[1], 10) : 0;
                    label = `MONTHLY(${m}월)`;
                    count = setupTabMonthlyMembers.length;
                } else if (view === 'members_list') {
                    if (memberSubTab === 'monthly') {
                        const m = targetMonth ? parseInt(targetMonth.split('-')[1], 10) : 0;
                        label = `MONTHLY(${m}월)`;
                        count = activeMembers.filter(m => {
                            if (STAFF_ROLES.includes(m.role)) return false; 
                            const status = monthlyStatuses[m.id];
                            const membershipInfo = getMembershipStatus(m, targetMonth);
                            if (status === 'paid') return true;
                            if (status === 'rest') return false; 
                            if (membershipInfo && membershipInfo.active) return true;
                            return false;
                        }).length;
                    } else {
                        label = "TOTAL"; 
                        count = activeMembers.length;
                    }
                } else {
                    label = "TOTAL"; 
                    count = activeMembers.length;
                }
                return { label, count };
            }, [view, memberSubTab, activeMembers, monthlyStatuses, setupTabMonthlyMembers.length, meetingTimes.date, targetMonth]);

            const filteredMonthlyMembers = useMemo(() => {
                let list = [...activeMembers].sort((a,b)=>a.name.localeCompare(b.name));
                if (filterCategory !== 'all') {
                    list = list.filter(m => {
                        const type = getMemberStatusType(m, monthlyStatuses, monthlyReasons, targetMonth);
                        return type === filterCategory;
                    });
                }
                return list;
            }, [activeMembers, filterCategory, monthlyStatuses, monthlyReasons, targetMonth]);

            const filterCounts = useMemo(() => {
                const counts = { all: activeMembers.length, monthly: 0, half: 0, full: 0, rest: 0, special: 0, unpaid: 0 };
                activeMembers.forEach(m => {
                    const type = getMemberStatusType(m, monthlyStatuses, monthlyReasons, targetMonth);
                    if (type !== 'staff') { 
                        if (counts[type] !== undefined) counts[type]++;
                    }
                });
                return counts;
            }, [activeMembers, monthlyStatuses, monthlyReasons, targetMonth]);

            const showAlert = (title, content, type = 'info', onConfirm = null) => setAlertModal({ show: true, title, content, type, onConfirm });
            const showConfirm = (title, content, onConfirm) => setAlertModal({ show: true, title, content, type: 'confirm', onConfirm });

            const getCoupleName = (id) => {
                const c = members.find(m => m.id === id);
                return c ? c.name : '';
            };

            const handleWithdraw = async () => {
                const { member, date, reason, isForced } = withdrawModal;
                if(!date) return showAlert("알림", "탈퇴 일자를 입력해주세요.");
                try {
                    await getMemberCol().doc(member.id).update({ status: 'withdrawn', withdrawnDate: date, withdrawalReason: reason, isForcedWithdrawal: isForced });
                    setWithdrawModal({ show: false, member: null, date: '', reason: '', isForced: false });
                    showAlert("처리 완료", `${member.name} 님이 탈퇴 처리되었습니다.`);
                } catch(e) { showAlert("오류", "탈퇴 처리 중 문제가 발생했습니다."); }
            };

            const handleRestore = async (member) => {
                showConfirm("회원 복구", `${member.name} 님을 다시 활성 회원으로 복구하시겠습니까?`, async () => {
                    try {
                        await getMemberCol().doc(member.id).update({ status: 'active', withdrawnDate: firebase.firestore.FieldValue.delete(), withdrawalReason: firebase.firestore.FieldValue.delete(), isForcedWithdrawal: firebase.firestore.FieldValue.delete() });
                        showAlert("복구 완료", "회원이 정상적으로 복구되었습니다.");
                    } catch(e) { showAlert("오류", "복구 중 문제가 발생했습니다."); }
                });
            };

            const updateMeetingTimeSettings = (newData) => {
                setMeetingTimes(newData);
                getSettingsCol().doc('meeting_time').set(newData);
            };

            const toggleParticipant = async (member) => {
                const targetDate = meetingTimes.date;
                const existing = sessionData.find(p => p.memberId === member.id && p.date === targetDate);
                if (existing) {
                    await getSessionCol().doc(existing.id).delete();
                } else {
                    await getSessionCol().add({ memberId: member.id, name: member.name, gender: member.gender, level: member.level, date: targetDate, checkedIn: false, checkInTime: null, status: '미출석', isGuest: false, team: '', createdAt: new Date().toISOString() });
                }
            };

            const registerCurrentAsManager = () => {
                if (!loggedInManager) return;
                updateMeetingTimeSettings({ ...meetingTimes, managerId: loggedInManager.id, managerName: loggedInManager.name });
            };

            const handleFontUpload = (e) => {
                const files = Array.from(e.target.files);
                files.forEach(file => {
                    if (file.name.endsWith('.ttf') || file.name.endsWith('.otf') || file.name.endsWith('.woff') || file.name.endsWith('.woff2')) {
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            const fontData = e.target.result;
                            const fontFace = new FontFace('Esamanru', fontData);
                            fontFace.load().then((loadedFont) => {
                                document.fonts.add(loadedFont);
                                setCustomFonts(prev => [...prev, file.name]);
                                showAlert("성공", `'${file.name}' 폰트가 적용되었습니다.`);
                            }).catch(err => { showAlert("오류", `'${file.name}' 폰트 로드 실패`); });
                        };
                        reader.readAsArrayBuffer(file);
                    } else { showAlert("알림", "폰트 파일(.ttf, .otf, .woff)만 지원합니다."); }
                });
            };

            const handleLogin = () => {
                if (!loginForm.name) return showAlert("알림", "로그인할 운영진을 선택해주세요.");
                const user = members.find(m => m.name === loginForm.name);
                if (!user) return showAlert("오류", "해당 사용자를 찾을 수 없습니다.");
                localStorage.setItem('otp_attendance_manager', JSON.stringify(user));
                setLoggedInManager(user);
                setIsLoginModalOpen(false);
                setLoginForm({ name: '', password: '' });
                showAlert("환영합니다", `${user.name} ${user.role}님 환영합니다!`);
            };

            const handleLogout = () => {
                localStorage.removeItem('otp_attendance_manager');
                setLoggedInManager(null);
                setIsLoginModalOpen(true);
                setView('attendance');
            };

            const handlePasswordChange = async () => {
                const { current, next, confirm } = passwordForm;
                const defaultPassword = loggedInManager.birth ? loggedInManager.birth.substring(2, 8) : "000000";
                const currentStored = loggedInManager.password || defaultPassword;
                if (current !== currentStored) return showAlert("오류", "현재 비밀번호가 틀립니다.");
                if (next.length < 4) return showAlert("알림", "비밀번호는 4자리 이상이어야 합니다.");
                if (next !== confirm) return showAlert("오류", "새 비밀번호가 서로 일치하지 않습니다.");
                try {
                    await getMemberCol().doc(loggedInManager.id).update({ password: next });
                    const updatedManager = { ...loggedInManager, password: next };
                    localStorage.setItem('otp_attendance_manager', JSON.stringify(updatedManager));
                    setLoggedInManager(updatedManager);
                    setIsPasswordChangeModalOpen(false);
                    setPasswordForm({ current: '', next: '', confirm: '' });
                    showAlert("성공", "비밀번호가 변경되었습니다.");
                } catch (e) { showAlert("오류", "변경 실패"); }
            };

            const handleLockToggle = () => {
                if (isAppLocked) setLockModalMode('unlock');
                else setLockModalMode('set');
                setTempPassword('');
            };

            const confirmLock = () => {
                if (!tempPassword.trim()) return showAlert("알림", "비밀번호를 입력하세요.");
                setLockPassword(tempPassword); setIsAppLocked(true); setLockModalMode(null); setView('attendance');
            };

            const confirmUnlock = () => {
                if (tempPassword === lockPassword) { setIsAppLocked(false); setLockPassword(''); setLockModalMode(null); }
                else showAlert("오류", "비밀번호가 틀렸습니다.");
            };

            const handleCheckIn = async (participant) => {
                const limit = meetingTimes.maxLimit || 18;
                const rank = activeParticipants.findIndex(p => p.id === participant.id) + 1;
                if (rank > limit) { return showAlert("대기자 안내", `선착순(${limit}명) 마감되었습니다. 대기자는 출석 체크를 할 수 없습니다.`); }
                const now = new Date();
                const meetingStart = new Date(`${participant.date}T${meetingTimes.start}`);
                const allowFrom = new Date(meetingStart.getTime() - 60 * 60 * 1000); 
                const allowFromStr = allowFrom.toLocaleTimeString('ko-KR', { hour12: false, hour: '2-digit', minute: '2-digit' });
                if (now < allowFrom) { setModal({ type: null, data: null }); return showAlert("아직 출석 가능 시간이 아닙니다.", `출석 가능 일시 : ${participant.date} ${allowFromStr}~${meetingTimes.end}`); }
                const lateThreshold = new Date(meetingStart.getTime() + 60000); 
                let finalStatus = now >= lateThreshold ? '지각' : '정상';
                const timeStr = now.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
                try {
                    await getSessionCol().doc(participant.id).update({ checkedIn: true, checkInTime: timeStr, status: finalStatus });
                    setModal({ type: null, data: null });
                } catch (e) { showAlert("오류", "출석 실패"); }
            };

            const handleUpdateMember = async () => {
                try {
                    await getMemberCol().doc(editingMember.id).update({ ...editingMember, birth: String(editingMember.birth).replace(/[^0-9]/g, '') });
                    setEditingMember(null);
                    showAlert("완료", "정보가 수정되었습니다.");
                } catch (e) { showAlert("오류", "수정 실패"); }
            };

            const handleAddMember = async () => {
                if (!newMember.name.trim()) return showAlert("알림", "이름을 입력해주세요.");
                const birthClean = String(newMember.birth).replace(/[^0-9]/g, '');
                try {
                    await getMemberCol().add({ ...newMember, birth: birthClean, createdAt: new Date().toISOString() });
                    setNewMember({ name: '', birth: '', gender: '남성', position: 'all', level: '1', role: '회원', coupleId: '', isEarlyBirth: false });
                    showAlert("성공", "회원이 등록되었습니다.");
                } catch (e) { showAlert("오류", "회원 등록 실패"); }
            };

            const handleBulkAdd = async () => {
                if (!bulkPasteText.trim()) return showAlert("알림", "붙여넣은 내용이 없습니다.");
                const lines = bulkPasteText.split(/\r?\n/).filter(line => line.trim() !== "");
                showConfirm("대량 등록", `${lines.length}명을 등록할까요?`, async () => {
                    setIsPending(true);
                    try {
                        const batch = db.batch();
                        const membersRef = getMemberCol();
                        lines.forEach(line => {
                            const fields = line.split(/[\t,]+/).map(f => f.trim());
                            if (fields.length >= 2) {
                                const [name, birth, gender, position, level, role] = fields;
                                let finalGender = gender && (gender.includes('여') || gender.includes('Female')) ? '여성' : '남성';
                                batch.set(membersRef.doc(), { name, birth: birth ? birth.replace(/[^0-9]/g, '') : '', gender: finalGender, position: position || 'all', level: level ? level.replace(/[^0-9]/g, '') : (finalGender === '남성' ? '1' : '7'), role: role || '회원', coupleId: '', isEarlyBirth: false, createdAt: new Date().toISOString() });
                            }
                        });
                        await batch.commit();
                        setBulkPasteText(''); setIsBulkMode(false);
                        showAlert("성공", "대량 등록 완료");
                    } catch (e) { showAlert("오류", "대량 등록 실패"); } finally { setIsPending(false); }
                });
            };

            const handleResetSelection = () => {
                const targets = sessionData.filter(p => p.date === meetingTimes.date);
                if (targets.length === 0) return showAlert("알림", "초기화할 명단이 없습니다.");
                showConfirm("명단 초기화", "이번 모임에 선정된 모든 인원을 해제하시겠습니까?", async () => {
                    setIsPending(true);
                    try {
                        const batch = db.batch();
                        targets.forEach(p => batch.delete(getSessionCol().doc(p.id)));
                        await batch.commit();
                        showAlert("성공", "선정 명단이 초기화되었습니다.");
                    } catch (e) { showAlert("오류", "초기화 실패"); } finally { setIsPending(false); }
                });
            };

            const handleAddGuest = async () => {
                if (!newGuest.name.trim()) return showAlert("알림", "게스트 이름을 입력해주세요.");
                const inviter = activeMembers.find(m => m.id === newGuest.inviterId);
                const targetDate = meetingTimes.date || getThisSunday();
                try {
                    await getSessionCol().add({ memberId: 'guest_' + Date.now(), name: newGuest.name, inviterName: inviter ? inviter.name : '없음', inviterId: newGuest.inviterId || '', gender: newGuest.gender, level: newGuest.level, date: targetDate, checkedIn: false, checkInTime: null, status: '미출석', isGuest: true, createdAt: new Date().toISOString() });
                    setIsGuestModalOpen(false);
                    setNewGuest({ name: '', gender: '남성', inviterId: '', inviterName: '', level: '1' });
                    showAlert("성공", "게스트가 추가되었습니다.");
                } catch (e) { showAlert("오류", "게스트 등록 실패"); }
            };

            const saveAndResetCurrent = async () => {
                const currentParticipants = sessionData.filter(p => p.date === meetingTimes.date);
                if (currentParticipants.length === 0) return showAlert("확인", "현재 출석부에 인원이 없습니다.");
                showConfirm("기록 확정 및 다음 모임 준비", "기록을 저장하고 다음 주로 날짜를 넘기시겠습니까?", async () => {
                    setIsPending(true);
                    try {
                        const limit = meetingTimes.maxLimit || 18;
                        const sorted = currentParticipants.sort((a,b) => {
                            const timeA = a.createdAt || '';
                            const timeB = b.createdAt || '';
                            if (timeA && timeB) return timeA.localeCompare(timeB);
                            return a.name.localeCompare(b.name);
                        });
                        const records = sorted.map((p, idx) => {
                            const rank = idx + 1;
                            const isWaiting = rank > limit;
                            let finalStatus = p.checkedIn ? (p.status || '정상') : '노쇼';
                            if (isWaiting) finalStatus = '대기';
                            else if (!p.checkedIn) finalStatus = '노쇼'; 
                            return { name: p.isGuest ? `${p.name.replace('(G)', '')} - 초대:${p.inviterName}` : p.name, gender: p.gender, status: finalStatus, checkInTime: p.checkedIn ? (p.checkInTime || '-') : '미출석', type: isWaiting ? '대기자' : (p.isGuest ? '게스트' : '정규'), level: p.level || '-', team: p.team || '-', timestamp: p.checkedIn ? p.checkInTime : '99:99:99' };
                        });
                        const presentCount = records.filter(r => (r.status === '정상' || r.status === '지각') && r.status !== '대기').length;
                        await getHistoryCol().add({ date: meetingTimes.date, meetingTime: `${meetingTimes.start} ~ ${meetingTimes.end}`, location: meetingTimes.location || "장소 미지정", managerName: meetingTimes.managerName || "미지정", total: records.length, present: presentCount, records, createdAt: new Date().toISOString() });
                        const batch = db.batch();
                        currentParticipants.forEach(p => batch.delete(getSessionCol().doc(p.id)));
                        const nextSun = getNextSundayFromDate(meetingTimes.date);
                        const nextSettings = { ...meetingTimes, date: nextSun, managerId: "", managerName: "" };
                        batch.set(getSettingsCol().doc('meeting_time'), nextSettings);
                        await batch.commit();
                        setMeetingTimes(nextSettings);
                        showAlert("기록 완료", `데이터가 보관되었습니다.\n다음 모임 일자: ${nextSun}`);
                    } catch (e) { showAlert("오류", "저장 실패"); } finally { setIsPending(false); }
                });
            };

            const handleDeleteHistory = (e) => {
                e.stopPropagation(); 
                if (!selectedHistoryDetail) return;
                showConfirm("기록 삭제", "이 기록을 영구 삭제하시겠습니까?", async () => {
                    try {
                        await getHistoryCol().doc(selectedHistoryDetail.id).delete();
                        setSelectedHistoryDetail(null);
                        showAlert("삭제 완료", "기록이 삭제되었습니다.");
                    } catch(err) { showAlert("오류", "삭제 중 문제가 발생했습니다."); }
                });
            };
            
            const handleHistoryStatusUpdate = async (newStatus) => {
                if (!historyEditTarget || !selectedHistoryDetail) return;
                const { docId, recordIndex } = historyEditTarget;
                try {
                    const updatedRecords = [...selectedHistoryDetail.records];
                    updatedRecords[recordIndex] = { ...updatedRecords[recordIndex], status: newStatus };
                    await getHistoryCol().doc(docId).update({ records: updatedRecords });
                    setSelectedHistoryDetail(prev => ({ ...prev, records: updatedRecords }));
                    setHistoryEditTarget(null); 
                    showAlert("수정 완료", "출석 상태가 변경되었습니다.");
                } catch(e) { showAlert("오류", "수정 중 문제가 발생했습니다."); }
            };
            
            const handleStatusUpdate = async (memberId, action, value = null) => {
                if (!targetMonth) return;
                try {
                    const batch = db.batch();
                    const monthRef = getMonthlyCol().doc(targetMonth);
                    const memberRef = getMemberCol().doc(memberId);
                    if (action === 'monthly_paid') {
                         batch.set(monthRef, { statuses: { [memberId]: 'paid' }, updatedAt: new Date().toISOString() }, { merge: true });
                         batch.update(monthRef, { [`reasons.${memberId}`]: firebase.firestore.FieldValue.delete() });
                        batch.update(memberRef, { membershipType: 'monthly', membershipStartDate: '', membershipEndDate: '', totalRestMonths: 0 });
                    } else if (action === 'start_half') {
                        const [y, m] = targetMonth.split('-').map(Number);
                        const endDate = new Date(y, m - 1 + 6, 0); 
                        const endDateStr = endDate.toISOString().split('T')[0];
                        batch.update(memberRef, { membershipType: 'half_year', membershipStartDate: `${targetMonth}-01`, membershipEndDate: endDateStr, totalRestMonths: 0 });
                         batch.update(monthRef, { [`statuses.${memberId}`]: firebase.firestore.FieldValue.delete(), [`reasons.${memberId}`]: firebase.firestore.FieldValue.delete() });
                    } else if (action === 'start_full') {
                         const [y, m] = targetMonth.split('-').map(Number);
                        const endDate = new Date(y, m - 1 + 12, 0); 
                        const endDateStr = endDate.toISOString().split('T')[0];
                        batch.update(memberRef, { membershipType: 'full_year', membershipStartDate: `${targetMonth}-01`, membershipEndDate: endDateStr, totalRestMonths: 0 });
                        batch.update(monthRef, { [`statuses.${memberId}`]: firebase.firestore.FieldValue.delete(), [`reasons.${memberId}`]: firebase.firestore.FieldValue.delete() });
                    } else if (action === 'rest') {
                         batch.set(monthRef, { statuses: { [memberId]: 'rest' }, updatedAt: new Date().toISOString() }, { merge: true });
                         batch.update(monthRef, { [`reasons.${memberId}`]: firebase.firestore.FieldValue.delete() });
                        const member = members.find(m => m.id === memberId);
                         if (member && member.membershipType === 'half_year' && (member.totalRestMonths || 0) >= 3) {
                            if((member.totalRestMonths || 0) >= 3) { return showAlert("반년납 회원은 휴식을 최대 3회까지만 사용할 수 있습니다."); }
                        }
                        if (member && (member.membershipType === 'half_year' || member.membershipType === 'full_year')) {
                            const currentEnd = new Date(member.membershipEndDate);
                            const nextEndDate = new Date(currentEnd.getFullYear(), currentEnd.getMonth() + 1 + 1, 0);
                            batch.update(memberRef, { membershipEndDate: nextEndDate.toISOString().split('T')[0], totalRestMonths: firebase.firestore.FieldValue.increment(1) });
                        }
                    } else if (action === 'special_rest') {
                        batch.set(monthRef, { statuses: { [memberId]: 'rest' }, reasons: { [memberId]: specialRestReason || '관리자 휴식' }, updatedAt: new Date().toISOString() }, { merge: true });
                        const member = members.find(m => m.id === memberId);
                        if (member && (member.membershipType === 'half_year' || member.membershipType === 'full_year')) {
                            const currentEnd = new Date(member.membershipEndDate);
                            const nextEndDate = new Date(currentEnd.getFullYear(), currentEnd.getMonth() + 1 + 1, 0);
                            batch.update(memberRef, { membershipEndDate: nextEndDate.toISOString().split('T')[0] });
                        }
                        setSpecialRestReason('');
                    } else if (action === 'end_membership') {
                         batch.update(memberRef, { membershipType: 'monthly', membershipStartDate: '', membershipEndDate: '', totalRestMonths: 0 });
                        batch.update(monthRef, { [`statuses.${memberId}`]: firebase.firestore.FieldValue.delete(), [`reasons.${memberId}`]: firebase.firestore.FieldValue.delete() });
                    } else if (action === 'clear') {
                         batch.update(monthRef, { [`statuses.${memberId}`]: firebase.firestore.FieldValue.delete(), [`reasons.${memberId}`]: firebase.firestore.FieldValue.delete() });
                    } else if (action === 'cancel_rest') {
                        batch.update(monthRef, { [`statuses.${memberId}`]: firebase.firestore.FieldValue.delete(), [`reasons.${memberId}`]: firebase.firestore.FieldValue.delete() });
                        const member = members.find(m => m.id === memberId);
                        const reason = monthlyReasons[memberId];
                        if (member && (member.membershipType === 'half_year' || member.membershipType === 'full_year')) {
                             const currentEnd = new Date(member.membershipEndDate);
                             const prevEndDate = new Date(currentEnd.getFullYear(), currentEnd.getMonth(), 0);
                             const updatePayload = { membershipEndDate: prevEndDate.toISOString().split('T')[0] };
                             if (!reason) { updatePayload.totalRestMonths = firebase.firestore.FieldValue.increment(-1); }
                             batch.update(memberRef, updatePayload);
                        }
                    } else if (action === 'update_end_date') {
                        if(manualEndDate) { batch.update(memberRef, { membershipEndDate: manualEndDate }); }
                    } else if (action === 'update_rest_count') {
                        if (value !== null) { batch.update(memberRef, { totalRestMonths: parseInt(value) }); }
                    }
                    await batch.commit();
                    if (action !== 'update_end_date' && action !== 'update_rest_count') setSelectedMonthlyMember(null); 
                } catch(e) { showAlert("오류", "상태 변경 실패"); }
            };

            const handleShowListModal = (listType) => {
                let filtered = [];
                let title = "";
                const sortedMembers = [...activeMembers].sort((a,b) => a.name.localeCompare(b.name));
                if (listType === 'unpaid') {
                    filtered = sortedMembers.filter(m => getMemberStatusType(m, monthlyStatuses, monthlyReasons, targetMonth) === 'unpaid');
                    title = `${targetMonth} 미납자 명단`;
                } else if (listType === 'half') {
                    filtered = sortedMembers.filter(m => {
                        if (STAFF_ROLES.includes(m.role)) return false;
                        const info = getMembershipStatus(m, targetMonth);
                        return info && info.active && info.type === '반년';
                    });
                    title = `${targetMonth} 반년납 명단`;
                } else if (listType === 'full') {
                    filtered = sortedMembers.filter(m => {
                        if (STAFF_ROLES.includes(m.role)) return false;
                        const info = getMembershipStatus(m, targetMonth);
                        return info && info.active && info.type === '1년';
                    });
                    title = `${targetMonth} 1년납 명단`;
                } else if (listType === 'rest_all') {
                    filtered = sortedMembers.filter(m => {
                        const t = getMemberStatusType(m, monthlyStatuses, monthlyReasons, targetMonth);
                        return t === 'rest' || t === 'special';
                    });
                    title = `${targetMonth} 휴식자 명단 (특별휴식 포함)`;
                }
                if (filtered.length === 0) { return showAlert("알림", "해당하는 인원이 없습니다."); }
                const items = filtered.map(m => {
                    let tag = null;
                    let details = null;
                    if (listType === 'half' || listType === 'full') {
                        const info = getMembershipStatus(m, targetMonth);
                        const statusType = getMemberStatusType(m, monthlyStatuses, monthlyReasons, targetMonth);
                        if (statusType === 'rest') tag = "휴식중";
                        if (statusType === 'special') tag = "특별휴식";
                        if (info) { details = `${info.endDateFormatted} 만료 | 잔여휴식 ${info.remainingRest}회`; }
                    } else if (listType === 'rest_all') {
                        const statusType = getMemberStatusType(m, monthlyStatuses, monthlyReasons, targetMonth);
                        tag = statusType === 'special' ? '특별휴식' : '일반휴식';
                    }
                    return { id: m.id, name: m.name, tag, details };
                });
                setListModalData({ title, count: filtered.length, items });
                setCapturedImage(null); 
            };

            const fallbackCopy = (text) => {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                textArea.style.position = "fixed";
                textArea.style.top = "0";
                textArea.style.left = "0";
                textArea.style.opacity = "0";
                document.body.appendChild(textArea);
                if (navigator.userAgent.match(/ipad|iphone|mac/i)) {
                    const range = document.createRange();
                    range.selectNodeContents(textArea);
                    const selection = window.getSelection();
                    selection.removeAllRanges();
                    selection.addRange(range);
                    textArea.setSelectionRange(0, 999999);
                } else { textArea.select(); }
                try {
                    document.execCommand('copy');
                    setListModalData(null);
                    setCapturedImage(null);
                    showAlert("복사 완료", `클립보드에 복사되었습니다.\n\n카카오톡 등 원하는 곳에 붙여넣기 하세요!`);
                } catch (err) { showAlert("오류", "복사에 실패했습니다. 권한을 확인해주세요."); } finally { document.body.removeChild(textArea); }
            };

            const handleCopyFromModal = () => {
                if (!listModalData) return;
                const names = listModalData.items.map(item => {
                    let str = `- ${item.name}`;
                    if (item.tag) str += ` [${item.tag}]`;
                    if (item.details) str += ` (${item.details})`;
                    return str;
                }).join('\n');
                const textToCopy = `[ ${listModalData.title} ]\n총 ${listModalData.count}명\n\n${names}`;
                if (navigator.clipboard && window.isSecureContext) {
                    navigator.clipboard.writeText(textToCopy).then(() => {
                        setListModalData(null);
                        setCapturedImage(null);
                        showAlert("복사 완료", `클립보드에 복사되었습니다.\n\n카카오톡 등 원하는 곳에 붙여넣기 하세요!`);
                    }).catch(() => fallbackCopy(textToCopy)); 
                } else { fallbackCopy(textToCopy); }
            };

            const handleCaptureImage = () => {
                setIsCapturing(true); 
                setTimeout(() => {
                    const target = document.getElementById('capture-area');
                    if (target) {
                        html2canvas(target, { scale: 2, backgroundColor: '#ffffff', useCORS: true }).then(canvas => {
                            const imageBase64 = canvas.toDataURL('image/png');
                            setCapturedImage(imageBase64); 
                            setIsCapturing(false); 
                        }).catch(err => { setIsCapturing(false); showAlert("오류", "이미지 생성에 실패했습니다."); });
                    } else { setIsCapturing(false); }
                }, 300);
            };

            const handleDownloadImage = () => {
                if (!capturedImage) return;
                const link = document.createElement('a');
                link.download = `${listModalData?.title || '명단'}.png`;
                link.href = capturedImage;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };
            
            useEffect(() => {
                const initAuth = async () => {
                    const timeout = setTimeout(() => {
                         const loader = document.getElementById('loading-screen');
                         if(loader) loader.style.opacity = '0';
                         setTimeout(() => { if(loader) loader.style.display = 'none'; }, 500);
                    }, 1000); 
                    try { await auth.signInAnonymously(); } catch (e) {} finally {
                        clearTimeout(timeout);
                        const loader = document.getElementById('loading-screen');
                        if(loader) {
                            loader.style.opacity = '0';
                            setTimeout(() => { loader.style.display = 'none'; }, 500);
                        }
                    }
                };
                initAuth();
                const unsubAuth = auth.onAuthStateChanged(u => {
                    if (u) {
                        getMemberCol().onSnapshot(snap => setMembers(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
                        getSessionCol().onSnapshot(snap => setSessionData(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
                        getHistoryCol().onSnapshot(snap => setHistory(snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => b.date.localeCompare(a.date))));
                        getSettingsCol().doc('meeting_time').onSnapshot(doc => { 
                            if (doc.exists) {
                                const data = doc.data();
                                const dataDate = new Date(data.date);
                                const yesterday = new Date();
                                yesterday.setDate(yesterday.getDate() - 1);
                                if (dataDate < yesterday) {
                                    const nextSunday = getThisSunday();
                                    if (data.date !== nextSunday) {
                                        const newData = { ...data, date: nextSunday, managerId: "", managerName: "" };
                                        getSettingsCol().doc('meeting_time').set(newData);
                                        setMeetingTimes(newData);
                                    } else { setMeetingTimes(prev => ({...prev, ...data})); }
                                } else { setMeetingTimes(prev => ({...prev, ...data})); }
                            }
                        });
                        getTeamDraftsCol().orderBy('createdAt', 'desc').limit(1).onSnapshot(snap => {
                             if (!snap.empty) { setTeamData(snap.docs[0].data()); } else { setTeamData(null); }
                        });
                    }
                });
                return () => unsubAuth();
            }, []);
            
            useEffect(() => {
                if (view === 'members_list' && targetMonth) {
                    const unsubMonthly = getMonthlyCol().doc(targetMonth).onSnapshot(doc => {
                        if (doc.exists) {
                            const data = doc.data();
                            if (data.statuses) {
                                setMonthlyStatuses(data.statuses);
                                setMonthlyParticipants(Object.keys(data.statuses).filter(id => data.statuses[id] === 'paid'));
                            } else if (data.memberIds) {
                                const newStatuses = {};
                                data.memberIds.forEach(id => newStatuses[id] = 'paid');
                                setMonthlyStatuses(newStatuses);
                                setMonthlyParticipants(data.memberIds);
                            } else { setMonthlyStatuses({}); setMonthlyParticipants([]); }
                            if (data.reasons) { setMonthlyReasons(data.reasons); } else { setMonthlyReasons({}); }
                        } else { setMonthlyStatuses({}); setMonthlyParticipants([]); setMonthlyReasons({}); }
                    });
                    return () => unsubMonthly();
                }
            }, [view, targetMonth]);
            
            useEffect(() => {
                if (meetingTimes.date) {
                    const [y, m] = meetingTimes.date.split('-');
                    const docKey = `${y}-${m}`;
                    const unsubSetupMonthly = getMonthlyCol().doc(docKey).onSnapshot(doc => {
                        if (doc.exists) {
                            const data = doc.data();
                            let validMembers = [];
                            if (data.statuses) { validMembers = Object.keys(data.statuses).filter(id => data.statuses[id] === 'paid'); } 
                            else if (data.memberIds) { validMembers = data.memberIds; }
                            activeMembers.forEach(member => {
                                const membershipInfo = getMembershipStatus(member, docKey);
                                if (STAFF_ROLES.includes(member.role)) { if (!validMembers.includes(member.id)) validMembers.push(member.id); } 
                                else if (membershipInfo && membershipInfo.active) {
                                    if (!validMembers.includes(member.id)) {
                                        const status = data.statuses ? data.statuses[member.id] : null;
                                        if (status !== 'rest') { validMembers.push(member.id); }
                                    }
                                }
                            });
                            setSetupTabMonthlyMembers(validMembers);
                        } else {
                            const autoMembers = activeMembers.filter(m => {
                                if (STAFF_ROLES.includes(m.role)) return true;
                                const info = getMembershipStatus(m, docKey);
                                return info && info.active;
                            }).map(m => m.id);
                            setSetupTabMonthlyMembers(autoMembers);
                        }
                    });
                    return () => unsubSetupMonthly();
                }
            }, [meetingTimes.date, activeMembers]);

            useEffect(() => {
                setModal({ type: null, data: null });
                setEditingMember(null);
                setIsGuestModalOpen(false);
                setLockModalMode(null);
                setSelectedHistoryDetail(null);
                setAlertModal(prev => ({...prev, show: false}));
                setIsPasswordChangeModalOpen(false);
                setIsManagerSelectorOpen(false); 
                setSelectedMonthlyMember(null);
                setSpecialRestReason('');
                setHistoryEditTarget(null); 
                setListModalData(null); 
                setCapturedImage(null);
                setWithdrawModal(prev => ({ ...prev, show: false }));
            }, [view]);

            return (
                <div className="min-h-screen pb-40 text-slate-900">
                    {!isAppLocked && !isLoginModalOpen && (
                        <nav className="sticky top-0 bg-white/90 backdrop-blur-md border-b z-50 h-16 sm:h-20 flex items-center px-4 shadow-sm text-slate-900 transition-all">
                            <div className="max-w-5xl mx-auto w-full flex justify-between items-center text-left">
                                <div className="flex gap-1 sm:gap-2">
                                    {['attendance', 'setup', 'history_list', 'members_list', 'settings'].map((v) => (
                                        <button key={v} onClick={() => setView(v)} className={`px-3 sm:px-6 py-2 rounded-xl font-black text-xs sm:text-base transition-all ${view.includes(v.split('_')[0]) ? 'bg-blue-600 text-white shadow-lg' : 'text-slate-400 hover:text-slate-600'}`}>
                                            {v === 'attendance' ? '출석' : v === 'setup' ? '선정' : v === 'history_list' ? '기록' : v === 'members_list' ? '전체명단' : '설정'}
                                        </button>
                                    ))}
                                </div>
                                <div className="flex items-center gap-2 sm:gap-3">
                                    {loggedInManager && (
                                        <button onClick={() => setIsPasswordChangeModalOpen(true)} className="hidden sm:flex items-center gap-2 px-4 py-2 bg-slate-50 border border-slate-100 rounded-xl text-xs font-black text-slate-600 hover:bg-slate-100 transition-all">
                                            <Icon.ShieldCheck size={14} className="text-blue-600" />
                                            {loggedInManager.name} ({loggedInManager.role})
                                        </button>
                                    )}
                                    <button onClick={() => window.location.reload()} className="p-2.5 rounded-xl bg-slate-50 text-slate-400 hover:text-blue-600 transition-all shadow-none border-none"><Icon.Refresh size={18} /></button>
                                    <button onClick={handleLogout} className="p-2.5 rounded-xl bg-red-50 text-red-500 hover:bg-red-100 transition-all shadow-none border-none"><Icon.LogOut size={18} /></button>
                                    <button onClick={handleLockToggle} className="p-2.5 rounded-xl bg-slate-50 text-slate-400 hover:text-blue-600 border border-slate-100 transition-all shadow-none border-none"><Icon.Lock size={18} /></button>
                                </div>
                            </div>
                        </nav>
                    )}

                    <main className={`p-4 sm:p-8 max-w-6xl mx-auto animate-zoom-in ${isAppLocked ? 'pt-16 sm:pt-20' : ''}`}>
                        {view === 'attendance' && !isLoginModalOpen && (
                            <div className="max-w-5xl mx-auto">
                                <div className="flex flex-col items-center mb-8 text-center">
                                    <div className="flex flex-col items-center mb-6 drop-shadow-xl animate-zoom-in hover:scale-105 transition-transform duration-300">
                                        {!logoError ? (
                                            <img src="KakaoTalk_20251203_102827701.png" alt="Emblem" className="w-24 h-24 sm:w-32 sm:h-32 object-contain mb-2 mx-auto" onError={() => setLogoError(true)} />
                                        ) : (
                                            <svg width="100" height="100" viewBox="0 0 100 100" fill="none" className="mb-2 mx-auto">
                                                <path d="M50 95C50 95 85 80 90 30H10C15 80 50 95 50 95Z" fill="#db2777" stroke="#fbbf24" strokeWidth="3"/>
                                                <circle cx="50" cy="55" r="12" fill="white"/>
                                            </svg>
                                        )}
                                        <h1 className="text-4xl sm:text-5xl font-black text-[#db2777] tracking-tighter uppercase leading-none mt-1 drop-shadow-sm">OTP FC</h1>
                                    </div>
                                    <CurrentTimeClock />
                                    <div className="bg-white px-5 py-2.5 rounded-full border border-slate-200 shadow-sm flex flex-wrap items-center justify-center gap-x-4 gap-y-1 text-xs sm:text-sm">
                                        <div className="flex items-center gap-1.5 font-bold text-slate-600"><Icon.Calendar size={14} className="text-slate-400"/><span>{meetingTimes.date}</span></div>
                                        <div className="w-px h-3 bg-slate-300"></div>

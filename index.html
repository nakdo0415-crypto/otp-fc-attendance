<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OTP FC Attendance</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Firebase SDK (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;700;900&display=swap');
        body { font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; background-color: #f8fafc; }
        .animate-zoom-in { animation: zoomIn 0.2s ease-out; }
        @keyframes zoomIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
        button:active { transform: scale(0.95); }
        #loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        input[type="checkbox"] { width: 20px; height: 20px; border-radius: 6px; cursor: pointer; accent-color: #2563eb; }
    </style>
</head>
<body>
    <div id="loading-screen">
        <div class="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
        <p class="mt-4 font-bold text-slate-500 italic">서버 권한 확인 중...</p>
    </div>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- 아이콘 세트 ---
        const Icon = {
            Users: ({size=20, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>,
            Trash: ({size=18, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>,
            Settings: ({size=22, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33 1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1-2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82 1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>,
            Check: ({size=20, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="20 6 9 17 4 12"/></svg>,
            Alert: ({size=40, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>,
            Clock: ({size=20, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
            CheckCircle: ({size=20, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>,
            Calendar: ({size=20, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>,
            History: ({size=22, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 8v4l3 3"/><path d="M3.05 11a9 9 0 1 1 .5 4m-.5 5v-5h5"/></svg>,
            Save: ({size=18, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>,
            FileSpreadsheet: ({size=20, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><path d="M8 13h2"/><path d="M8 17h2"/><path d="M14 13h2"/><path d="M14 17h2"/></svg>,
            Sparkles: ({size=18, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
        };

        // --- Firebase Configuration ---
        const config = {
            apiKey: "AIzaSyCAcQzliuWJTB8vPm9gb0vsyR8pIAx7YTw",
            authDomain: "otp-fc-check.firebaseapp.com",
            projectId: "otp-fc-check",
            storageBucket: "otp-fc-check.firebasestorage.app",
            messagingSenderId: "907414776392",
            appId: "1:907414776392:web:0a29a660bb956e5a40467d"
        };

        if (!firebase.apps.length) firebase.initializeApp(config);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const APP_ID = 'otp-fc-attendance';

        // 데이터 경로 헬퍼
        const getCol = (name) => db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection(name);
        const getMemberCol = () => getCol('members');
        const getSessionCol = () => getCol('weekly_session');
        const getHistoryCol = () => getCol('history');
        const getSettingsCol = () => getCol('settings');

        function App() {
            const [view, setView] = useState('attendance');
            const [members, setMembers] = useState([]);
            const [session, setSession] = useState([]);
            const [history, setHistory] = useState([]);
            const [selectedHistory, setSelectedHistory] = useState(null);
            const [user, setUser] = useState(null);
            const [modal, setModal] = useState({ type: null, data: null });
            const [isPending, setIsPending] = useState(false);
            const [error, setError] = useState(null);
            
            // 공용 알림 모달 (브라우저 alert 대체)
            const [alertModal, setAlertModal] = useState({ show: false, title: '', content: '', type: 'info', onConfirm: null });

            const todayStr = new Date().toISOString().split('T')[0];
            const [meetingTimes, setMeetingTimes] = useState({ date: todayStr, start: "19:00", end: "21:00" });
            const [bulkText, setBulkText] = useState('');
            const [newMemberName, setNewMemberName] = useState('');
            const [newMemberGender, setNewMemberGender] = useState('남성');
            const [isBulkMode, setIsBulkMode] = useState(false);
            const [selectedMemberIds, setSelectedMemberIds] = useState(new Set());
            const [currentTime, setCurrentTime] = useState(new Date());

            useEffect(() => {
                const timer = setInterval(() => setCurrentTime(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);

            // 커스텀 알림/확인창 함수
            const showAlert = (title, content, type = 'info') => setAlertModal({ show: true, title, content, type, onConfirm: null });
            const showConfirm = (title, content, onConfirm) => setAlertModal({ show: true, title, content, type: 'confirm', onConfirm });

            // -- 기능 함수 정의 --
            const saveMeetingSettings = async (date, start, end) => {
                try { await getSettingsCol().doc('meeting_time').set({ date, start, end }); } 
                catch (e) { console.error("설정 저장 실패", e); }
            };

            const saveCurrentToHistory = async () => {
                if (session.length === 0) return showAlert("저장 불가", "저장할 참여 명단이 없습니다.");
                showConfirm("기록 저장", `${meetingTimes.date}일자 기록을 영구 저장하시겠습니까?`, async () => {
                    setIsPending(true);
                    try {
                        const todayStr = currentTime.toISOString().split('T')[0];
                        const [eH, eM] = meetingTimes.end.split(':').map(Number);
                        const endLimit = new Date(); endLimit.setHours(eH, eM, 0, 0);

                        const records = session.map(p => {
                            let finalStatus = p.status || '미출석';
                            if (!p.checkedIn && (todayStr > meetingTimes.date || (todayStr === meetingTimes.date && currentTime > endLimit))) {
                                finalStatus = '노쇼';
                            }
                            return { name: p.name, gender: p.gender, status: finalStatus, checkInTime: p.checkInTime || '-', type: p.type };
                        });

                        await getHistoryCol().doc(meetingTimes.date).set({
                            date: meetingTimes.date, meetingTime: `${meetingTimes.start} ~ ${meetingTimes.end}`,
                            total: records.length, present: records.filter(r => r.status === '정상' || r.status === '지각').length,
                            records: records, createdAt: new Date().toISOString()
                        });
                        showAlert("성공", `${meetingTimes.date} 기록이 저장되었습니다.`);
                    } catch (e) { showAlert("오류", "기록 저장 중 문제가 발생했습니다."); } 
                    finally { setIsPending(false); }
                });
            };

            const addMember = async () => {
                if (!newMemberName.trim() || isPending) return;
                setIsPending(true);
                try {
                    await getMemberCol().add({ name: newMemberName.trim(), gender: newMemberGender, type: 'regular', createdAt: new Date().toISOString() });
                    setNewMemberName('');
                } catch (e) { showAlert("오류", "회원 추가 실패"); }
                finally { setIsPending(false); }
            };

            const handleBulkAdd = async () => {
                if (!bulkText.trim() || isPending) return;
                const names = bulkText.split(/[\r\n\t,]+/).map(n => n.trim()).filter(n => n.length > 0);
                if (names.length === 0) return showAlert("입력 확인", "이름을 입력하세요.");
                showConfirm("일괄 등록", `${names.length}명을 각각 등록하시겠습니까?`, async () => {
                    setIsPending(true);
                    try {
                        const membersRef = getMemberCol();
                        for (let i = 0; i < names.length; i += 400) {
                            const batch = db.batch();
                            names.slice(i, i + 400).forEach(name => { batch.set(membersRef.doc(), { name, gender: newMemberGender, type: 'regular', createdAt: new Date().toISOString() }); });
                            await batch.commit();
                        }
                        setBulkText(''); setIsBulkMode(false);
                        showAlert("성공", "일괄 등록이 완료되었습니다.");
                    } catch (e) { showAlert("오류", "등록 중 문제가 발생했습니다."); }
                    finally { setIsPending(false); }
                });
            };

            const deleteMember = async (id, name) => {
                showConfirm("회원 삭제", `${name} 님을 명단에서 영구 삭제하시겠습니까?`, async () => {
                    try { await getMemberCol().doc(id).delete(); } 
                    catch (e) { showAlert("오류", "삭제 권한이 없습니다."); }
                });
            };

            const deleteSelected = async () => {
                if (selectedMemberIds.size === 0) return showAlert("선택 확인", "삭제할 회원을 먼저 체크해주세요.");
                showConfirm("선택 삭제", `선택한 ${selectedMemberIds.size}명을 삭제하시겠습니까?`, async () => {
                    setIsPending(true);
                    try {
                        const membersRef = getMemberCol();
                        const batch = db.batch();
                        selectedMemberIds.forEach(id => batch.delete(membersRef.doc(id)));
                        await batch.commit();
                        setSelectedMemberIds(new Set());
                    } catch (e) { showAlert("오류", "삭제 실패"); }
                    finally { setIsPending(false); }
                });
            };

            const deleteAllMembers = async () => {
                if (members.length === 0) return showAlert("확인", "삭제할 명단이 없습니다.");
                showConfirm("전체 삭제", "⚠️ 주의: 전체 명단을 모두 삭제하시겠습니까?", async () => {
                    setIsPending(true);
                    try {
                        const membersRef = getMemberCol();
                        const snap = await membersRef.get();
                        const batch = db.batch();
                        snap.docs.forEach(doc => batch.delete(doc.ref));
                        await batch.commit();
                    } catch (e) { showAlert("오류", "전체 삭제 실패"); }
                    finally { setIsPending(false); }
                });
            };

            const cleanupDuplicates = async () => {
                showConfirm("중복 정리", "중복된 이름을 가진 회원을 정리하시겠습니까?", async () => {
                    setIsPending(true);
                    try {
                        const seen = new Set();
                        const toDelete = [];
                        members.forEach(m => {
                            if (seen.has(m.name)) toDelete.push(m.id);
                            else seen.add(m.name);
                        });
                        if (toDelete.length === 0) return showAlert("확인", "중복 명단이 없습니다.");
                        const membersRef = getMemberCol();
                        const batch = db.batch();
                        toDelete.forEach(id => batch.delete(membersRef.doc(id)));
                        await batch.commit();
                        showAlert("정리 완료", `${toDelete.length}명의 중복 데이터를 정리했습니다.`);
                    } catch (e) { showAlert("오류", "정리 실패"); }
                    finally { setIsPending(false); }
                });
            };

            const toggleSelect = (id) => {
                const next = new Set(selectedMemberIds);
                if (next.has(id)) next.delete(id); else next.add(id);
                setSelectedMemberIds(next);
            };

            const toggleAllSelect = () => {
                if (selectedMemberIds.size === members.length && members.length > 0) setSelectedMemberIds(new Set());
                else setSelectedMemberIds(new Set(members.map(m => m.id)));
            };

            const toggleParticipant = async (m) => {
                const existing = session.find(p => p.memberId === m.id);
                try {
                    if (existing) await getSessionCol().doc(existing.id).delete();
                    else await getSessionCol().add({ memberId: m.id, name: m.name, gender: m.gender, type: 'regular', checkedIn: false, status: '미출석' });
                } catch (e) { console.error("선정 오류", e); }
            };

            const handleCheckIn = async (participant) => {
                const now = new Date();
                const todayStr = now.toISOString().split('T')[0];
                if (todayStr !== meetingTimes.date) return showAlert("날짜 확인", `오늘은 모임 날짜(${meetingTimes.date})가 아닙니다.`);
                try {
                    const [sH, sM] = meetingTimes.start.split(':').map(Number);
                    const startLimit = new Date(); startLimit.setHours(sH, sM, 0, 0);
                    const lateThreshold = new Date(startLimit.getTime() + 60000);
                    let finalStatus = now >= lateThreshold ? '지각' : '정상';
                    const timeStr = now.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                    await getSessionCol().doc(participant.id).update({ checkedIn: true, checkInTime: timeStr, status: finalStatus });
                    setModal({ type: null, data: null });
                } catch (e) { showAlert("오류", "출석 체크 실패"); }
            };

            // -- Sync --
            useEffect(() => {
                const initAuth = async () => {
                    try { await auth.signInAnonymously(); document.getElementById('loading-screen').style.display = 'none'; }
                    catch (e) { setError('auth'); document.getElementById('loading-screen').style.display = 'none'; }
                };
                initAuth();
                const unsubAuth = auth.onAuthStateChanged(u => setUser(u));
                return () => unsubAuth();
            }, []);

            useEffect(() => {
                if (!user) return;
                const unsubM = getMemberCol().onSnapshot(snap => setMembers(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
                const unsubS = getSessionCol().onSnapshot(snap => setSession(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
                const unsubT = getSettingsCol().doc('meeting_time').onSnapshot(doc => { if (doc.exists) setMeetingTimes(doc.data()); });
                const unsubH = getHistoryCol().onSnapshot(snap => setHistory(snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => b.date.localeCompare(a.date))));
                return () => { unsubM(); unsubS(); unsubT(); unsubH(); };
            }, [user]);

            if (error) return <div className="min-h-screen flex items-center justify-center p-6 bg-slate-50 text-center font-bold">서버 연결 권한 오류</div>;

            return (
                <div className="min-h-screen pb-40">
                    <nav className="sticky top-0 bg-white/90 backdrop-blur-md border-b z-50 h-20 flex items-center px-4">
                        <div className="max-w-5xl mx-auto w-full flex justify-between items-center">
                            <div className="flex gap-2">
                                <button onClick={() => setView('attendance')} className={`px-5 py-2.5 rounded-2xl font-black text-sm sm:text-lg transition-all ${view === 'attendance' ? 'bg-blue-600 text-white shadow-lg' : 'text-slate-400'}`}>출석</button>
                                <button onClick={() => setView('setup')} className={`px-5 py-2.5 rounded-2xl font-black text-sm sm:text-lg transition-all ${view === 'setup' ? 'bg-green-600 text-white shadow-lg' : 'text-slate-400'}`}>선정</button>
                                <button onClick={() => setView('history')} className={`px-5 py-2.5 rounded-2xl font-black text-sm sm:text-lg transition-all ${view === 'history' ? 'bg-purple-600 text-white shadow-lg' : 'text-slate-400'}`}>기록</button>
                            </div>
                            <button onClick={() => setView('members')} className={`p-3 rounded-2xl transition-all ${view === 'members' ? 'bg-slate-900 text-white shadow-lg' : 'bg-slate-100 text-slate-400'}`}><Icon.Settings /></button>
                        </div>
                    </nav>

                    <main className="p-4 sm:p-8 max-w-5xl mx-auto animate-zoom-in">
                        {view === 'attendance' && (
                            <div>
                                <header className="text-center mb-10">
                                    <h1 className="text-5xl font-black text-blue-900 italic tracking-tighter mb-2 uppercase">OTP FC</h1>
                                    <div className="flex flex-col sm:flex-row justify-center items-center gap-2 text-xs font-black text-slate-400 uppercase tracking-widest bg-white/50 py-3 rounded-3xl border border-slate-100 max-w-md mx-auto">
                                        <div className="flex items-center gap-1.5"><Icon.Calendar size={14}/> {meetingTimes.date}</div>
                                        <div className="flex items-center gap-1.5"><Icon.Clock size={14}/> {meetingTimes.start} ~ {meetingTimes.end}</div>
                                    </div>
                                </header>
                                <div className="grid grid-cols-2 sm:grid-cols-5 gap-3">
                                    {[...session].sort((a,b) => a.name.localeCompare(b.name)).map(p => {
                                        const todayStr = currentTime.toISOString().split('T')[0];
                                        const [eH, eM] = meetingTimes.end.split(':').map(Number);
                                        const endThreshold = new Date(); endThreshold.setHours(eH, eM, 0, 0);
                                        const isNoShow = !p.checkedIn && (todayStr > meetingTimes.date || (todayStr === meetingTimes.date && currentTime > endThreshold));
                                        return (
                                            <button key={p.id} onClick={() => p.checkedIn ? setModal({type:'cancel', data:p}) : setModal({type:'check', data:p})}
                                                className={`relative h-40 sm:h-52 rounded-[40px] flex flex-col items-center justify-center px-4 transition-all shadow-lg active:scale-90 ${p.checkedIn ? 'bg-blue-50/50 text-slate-400 border-2 border-blue-200' : isNoShow ? 'bg-red-50 border-2 border-red-200' : 'bg-white border-2 border-blue-50 text-blue-900'}`}>
                                                <div className="absolute top-4">
                                                    {p.checkedIn ? <span className={`text-[9px] font-black px-2 py-0.5 rounded-full ${p.status === '정상' ? 'bg-green-100 text-green-600' : 'bg-orange-100 text-orange-600'}`}>{p.status}</span> : isNoShow ? <span className="text-[9px] font-black px-2 py-0.5 rounded-full bg-red-600 text-white animate-pulse">노쇼</span> : null}
                                                </div>
                                                <span className={`text-xl sm:text-2xl font-black w-full text-center leading-tight break-keep ${p.checkedIn ? 'text-blue-400' : isNoShow ? 'text-red-400' : ''}`}>{p.name}</span>
                                                {p.checkedIn ? <span className="text-xs font-black text-blue-800 bg-blue-100 px-3 py-1 rounded-full mt-2">{p.checkInTime}</span> : <span className={`text-xs sm:text-sm font-black mt-2 uppercase ${p.gender === '남성' ? 'text-blue-600' : 'text-red-500'}`}>{p.gender}</span>}
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        {view === 'history' && (
                            <div className="max-w-2xl mx-auto">
                                <h2 className="text-2xl font-black mb-8 flex items-center gap-2"><Icon.History className="text-purple-600" /> 모임 출석 기록</h2>
                                {!selectedHistory ? (
                                    <div className="space-y-3">
                                        {history.length === 0 ? <p className="text-center py-20 text-slate-400 font-bold">저장된 기록이 없습니다.</p> : history.map(h => (
                                            <button key={h.id} onClick={() => setSelectedHistory(h)} className="w-full flex items-center justify-between p-6 bg-white rounded-[32px] border border-slate-100 shadow-sm hover:border-purple-300 transition-all text-left">
                                                <div><p className="text-lg font-black text-slate-900">{h.date}</p><p className="text-xs font-bold text-slate-400 mt-1 uppercase">{h.meetingTime}</p></div>
                                                <div className="text-right"><p className="text-xl font-black text-purple-600">{h.present}/{h.total}</p><p className="text-[10px] font-bold text-slate-300">ATTENDANCE</p></div>
                                            </button>
                                        ))}
                                    </div>
                                ) : (
                                    <div className="bg-white rounded-[40px] border border-slate-100 shadow-xl overflow-hidden animate-zoom-in">
                                        <div className="p-8 bg-slate-900 text-white flex justify-between items-center">
                                            <div><h3 className="text-2xl font-black">{selectedHistory.date}</h3><p className="text-xs font-bold opacity-50">{selectedHistory.meetingTime}</p></div>
                                            <button onClick={() => setSelectedHistory(null)} className="p-3 bg-white/10 rounded-2xl font-bold text-sm">목록으로</button>
                                        </div>
                                        <div className="p-6">
                                            <div className="grid grid-cols-2 gap-2 mb-6">
                                                <div className="p-4 bg-slate-50 rounded-2xl text-center"><p className="text-[10px] font-black text-slate-400">참석율</p><p className="text-2xl font-black text-slate-900">{selectedHistory.total > 0 ? Math.round((selectedHistory.present/selectedHistory.total)*100) : 0}%</p></div>
                                                <div className="p-4 bg-slate-50 rounded-2xl text-center"><p className="text-[10px] font-black text-slate-400">참여인원</p><p className="text-2xl font-black text-slate-900">{selectedHistory.total}명</p></div>
                                            </div>
                                            <div className="space-y-2 max-h-[400px] overflow-y-auto pr-2 custom-scrollbar">
                                                {[...selectedHistory.records].sort((a,b) => a.name.localeCompare(b.name)).map((r,idx) => (
                                                    <div key={idx} className="flex items-center justify-between p-4 bg-slate-50 rounded-2xl">
                                                        <div className="flex items-center gap-3"><span className="font-bold text-lg">{r.name}</span><span className={`text-[10px] font-black ${r.gender === '남성' ? 'text-blue-500' : 'text-red-400'}`}>{r.gender}</span></div>
                                                        <div className="flex items-center gap-3"><span className="text-xs font-bold text-slate-400">{r.checkInTime}</span><span className={`px-2 py-0.5 rounded-full text-[10px] font-black ${r.status === '정상' ? 'bg-green-100 text-green-600' : r.status === '지각' ? 'bg-orange-100 text-orange-600' : 'bg-red-100 text-red-600'}`}>{r.status}</span></div>
                                                    </div>
                                                ))}
                                            </div>
                                            <button onClick={() => showConfirm("기록 삭제", "이 기록을 영구적으로 삭제하시겠습니까?", async () => { await getHistoryCol().doc(selectedHistory.id).delete(); setSelectedHistory(null); })} className="w-full mt-6 py-4 text-red-400 text-sm font-bold border-t border-slate-100">기록 영구 삭제</button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {view === 'members' && (
                            <div className="max-w-2xl mx-auto">
                                <div className="bg-white p-6 rounded-[32px] border border-slate-100 shadow-sm mb-8">
                                    <div className="flex justify-between items-center mb-6">
                                        <h3 className="text-sm font-black text-slate-400 flex items-center gap-2"><Icon.Calendar size={16}/> 모임 일정 및 기록 저장</h3>
                                        <button onClick={saveCurrentToHistory} disabled={isPending} className="px-4 py-2 bg-purple-600 text-white rounded-xl text-xs font-black flex items-center gap-2 shadow-lg shadow-purple-100"><Icon.Save size={14}/> 명단 기록 저장</button>
                                    </div>
                                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                        <div><label className="text-[10px] font-black text-slate-400 ml-2">날짜</label><input type="date" className="w-full p-4 bg-slate-50 rounded-2xl font-black outline-none" value={meetingTimes.date} onChange={e => { const v = e.target.value; setMeetingTimes(p => ({...p, date: v})); saveMeetingSettings(v, meetingTimes.start, meetingTimes.end); }} /></div>
                                        <div><label className="text-[10px] font-black text-slate-400 ml-2">시작</label><input type="time" className="w-full p-4 bg-slate-50 rounded-2xl font-black outline-none" value={meetingTimes.start} onChange={e => { const v = e.target.value; setMeetingTimes(p => ({...p, start: v})); saveMeetingSettings(meetingTimes.date, v, meetingTimes.end); }} /></div>
                                        <div><label className="text-[10px] font-black text-slate-400 ml-2">종료</label><input type="time" className="w-full p-4 bg-slate-50 rounded-2xl font-black outline-none" value={meetingTimes.end} onChange={e => { const v = e.target.value; setMeetingTimes(p => ({...p, end: v})); saveMeetingSettings(meetingTimes.date, meetingTimes.start, v); }} /></div>
                                    </div>
                                </div>
                                <div className="flex flex-col gap-6 mb-8">
                                    <div className="flex justify-between items-center"><h2 className="text-2xl font-black flex items-center gap-2"><Icon.Users className="text-blue-600" /> 명단 통합 관리</h2><button onClick={() => setIsBulkMode(!isBulkMode)} className="bg-blue-100 text-blue-700 px-4 py-2 rounded-xl text-xs font-black">{isBulkMode ? '개별 모드' : '대량 모드'}</button></div>
                                    <div className="flex flex-wrap gap-2">
                                        <button onClick={cleanupDuplicates} disabled={isPending} className="flex-1 bg-purple-50 text-purple-600 px-4 py-3 rounded-2xl text-xs font-black flex items-center justify-center gap-2 border border-purple-100"><Icon.Sparkles /> 중복 정리</button>
                                        <button onClick={deleteSelected} disabled={isPending || selectedMemberIds.size === 0} className="flex-1 bg-orange-50 text-orange-600 px-4 py-3 rounded-2xl text-xs font-black">선택 삭제 ({selectedMemberIds.size})</button>
                                        <button onClick={deleteAllMembers} disabled={isPending || members.length === 0} className="flex-1 bg-red-50 text-red-600 px-4 py-3 rounded-2xl text-xs font-black">전체 삭제</button>
                                    </div>
                                </div>
                                <div className="bg-white p-6 rounded-[32px] border border-slate-100 shadow-sm mb-6">
                                    {isBulkMode ? (
                                        <div className="space-y-4">
                                            <div className="flex items-center gap-2 text-xs font-bold text-slate-400 px-1"><Icon.FileSpreadsheet size={14}/> <span>엑셀 셀을 복사해서 그대로 붙여넣으세요.</span></div>
                                            <textarea rows="6" placeholder="여기에 명단을 붙여넣으세요..." className="w-full p-5 bg-slate-50 rounded-3xl font-bold outline-none resize-none transition-all custom-scrollbar" value={bulkText} onChange={e => setBulkText(e.target.value)} />
                                            <button onClick={handleBulkAdd} disabled={isPending} className="w-full bg-blue-600 text-white py-4 rounded-2xl font-black shadow-lg">일괄 등록</button>
                                        </div>
                                    ) : (
                                        <div className="flex flex-col gap-3">
                                            <input type="text" placeholder="이름" className="p-4 bg-slate-50 rounded-2xl font-bold outline-none" value={newMemberName} onChange={e => setNewMemberName(e.target.value)} />
                                            <div className="flex gap-2"><select className="flex-1 p-4 bg-slate-50 rounded-2xl font-bold outline-none" value={newMemberGender} onChange={e => setNewMemberGender(e.target.value)}><option>남성</option><option>여성</option></select><button onClick={addMember} disabled={isPending} className="bg-blue-600 text-white px-8 rounded-2xl font-black shadow-lg">추가</button></div>
                                        </div>
                                    )}
                                </div>
                                <div className="flex items-center gap-2 mb-4 px-3"><input type="checkbox" checked={members.length > 0 && selectedMemberIds.size === members.length} onChange={toggleAllSelect} /><span className="text-sm font-black text-slate-400 uppercase tracking-widest">명단 선택 ({members.length}명)</span></div>
                                <div className="space-y-2 max-h-[400px] overflow-y-auto pr-1 custom-scrollbar">
                                    {[...members].sort((a,b)=>a.name.localeCompare(b.name)).map(m => (
                                        <div key={m.id} className={`flex items-center justify-between p-4 bg-white rounded-2xl border transition-all ${selectedMemberIds.has(m.id) ? 'border-blue-500 bg-blue-50/10' : 'border-slate-50'}`}>
                                            <div className="flex items-center gap-4"><input type="checkbox" checked={selectedMemberIds.has(m.id)} onChange={() => toggleSelect(m.id)} /><span className="font-bold text-lg">{m.name} <small className={`ml-1 font-black ${m.gender === '남성' ? 'text-blue-600' : 'text-red-500'}`}>{m.gender}</small></span></div>
                                            <button onClick={() => deleteMember(m.id, m.name)} className="text-slate-200 hover:text-red-500 transition-colors p-2"><Icon.Trash /></button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {view === 'setup' && (
                            <div>
                                <h2 className="text-2xl font-black mb-8 flex items-center gap-2"><Icon.Calendar className="text-green-600" /> 참여 인원 선정</h2>
                                <div className="grid grid-cols-2 sm:grid-cols-5 gap-3">
                                    {[...members].sort((a,b)=>a.name.localeCompare(b.name)).map(m => {
                                        const isSel = session.some(p => p.memberId === m.id);
                                        return (
                                            <button key={m.id} onClick={() => toggleParticipant(m)} className={`p-4 h-24 rounded-2xl border-2 transition-all flex flex-col items-center justify-center relative active:scale-95 ${isSel ? 'border-green-500 bg-green-50 shadow-md' : 'bg-white border-slate-100 opacity-60'}`}>
                                                <span className="font-black text-lg w-full text-center break-keep">{m.name}</span>
                                                <span className={`text-[10px] font-bold ${m.gender === '남성' ? 'text-blue-600' : 'text-red-500'}`}>{m.gender}</span>
                                                {isSel && <div className="absolute top-2 right-2 text-green-600"><Icon.CheckCircle size={16} /></div>}
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>
                        )}
                    </main>

                    <div className="fixed bottom-6 left-1/2 -translate-x-1/2 bg-white/90 backdrop-blur-2xl border border-white shadow-2xl rounded-full px-10 py-4 flex gap-10 items-center z-40 border-t border-slate-50 scale-90 sm:scale-100">
                        <div className="text-center"><p className="text-[8px] text-slate-400 font-black uppercase italic">Selected</p><p className="text-xl font-black text-slate-900">{session.length}</p></div>
                        <div className="w-px h-8 bg-slate-100" />
                        <div className="text-center"><p className="text-[8px] text-slate-400 font-black uppercase italic">Presence</p><p className="text-xl font-black text-green-600">{session.filter(p=>p.checkedIn).length}</p></div>
                    </div>

                    {/* 커스텀 메시지/확인 모달 */}
                    {alertModal.show && (
                        <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-md z-[200] flex items-center justify-center p-4">
                            <div className="bg-white rounded-[40px] w-full max-w-sm p-8 shadow-2xl animate-zoom-in text-center">
                                <h3 className="text-2xl font-black mb-4 text-slate-900">{alertModal.title}</h3>
                                <p className="text-slate-500 font-bold mb-8 leading-relaxed whitespace-pre-wrap">{alertModal.content}</p>
                                <div className="flex gap-3">
                                    {alertModal.type === 'confirm' && (
                                        <button onClick={() => setAlertModal(p => ({...p, show: false}))} className="flex-1 py-4 bg-slate-100 text-slate-500 rounded-3xl font-black">취소</button>
                                    )}
                                    <button onClick={() => { 
                                        if (alertModal.onConfirm) alertModal.onConfirm();
                                        setAlertModal(p => ({...p, show: false}));
                                    }} className={`flex-1 py-4 text-white rounded-3xl font-black shadow-lg ${alertModal.type === 'confirm' ? 'bg-blue-600' : 'bg-slate-900'}`}>확인</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {modal.type === 'check' && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-[100] flex items-center justify-center p-4">
                            <div className="bg-white rounded-[48px] w-full max-w-sm p-10 text-center animate-zoom-in shadow-2xl">
                                <h2 className="text-4xl font-black text-slate-900 mb-10 tracking-tighter break-keep">{modal.data.name} 님</h2>
                                <button onClick={() => handleCheckIn(modal.data)} className="w-full bg-blue-600 text-white py-6 rounded-[32px] text-2xl font-black shadow-xl hover:bg-blue-700 active:scale-95 transition-all">출석 확인</button>
                                <button onClick={() => setModal({type:null, data:null})} className="mt-4 text-slate-400 font-bold hover:text-slate-600">닫기</button>
                            </div>
                        </div>
                    )}

                    {modal.type === 'cancel' && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-[100] flex items-center justify-center p-4">
                            <div className="bg-white rounded-[48px] w-full max-w-sm p-10 text-center animate-zoom-in shadow-2xl">
                                <h2 className="text-3xl font-black mb-8 text-slate-900 tracking-tighter break-keep">{modal.data.name} 님</h2>
                                <p className="mb-10 text-slate-400 font-bold italic text-sm">출석 기록을 취소하시겠습니까?</p>
                                <button onClick={async () => { try { await getSessionCol().doc(modal.data.id).update({ checkedIn: false, checkInTime: null, status: '미출석' }); setModal({ type: null, data: null }); } catch(e) { console.error(e); } }} className="w-full bg-red-500 text-white py-6 rounded-[32px] text-xl font-black shadow-xl active:scale-95 transition-all">출석 취소하기</button>
                                <button onClick={() => setModal({type:null, data:null})} className="mt-4 text-slate-400 font-bold hover:text-slate-600">돌아가기</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

                                        <h2 className="text-3xl font-black text-blue-600 tracking-tighter">Master Directory</h2>
                                        <div className="flex bg-slate-100 p-1 rounded-xl">
                                            <button onClick={() => setMemberSubTab('directory')} className={`px-4 py-2 text-xs font-black rounded-lg ${memberSubTab === 'directory' ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-400'}`}>회원 관리</button>
                                            <button onClick={() => setMemberSubTab('monthly')} className={`px-4 py-2 text-xs font-black rounded-lg ${memberSubTab === 'monthly' ? 'bg-white text-green-600 shadow-sm' : 'text-slate-400'}`}>월별 참여</button>
                                            <button onClick={() => setMemberSubTab('withdrawn')} className={`px-4 py-2 text-xs font-black rounded-lg ${memberSubTab === 'withdrawn' ? 'bg-white text-orange-600 shadow-sm' : 'text-slate-400'}`}>탈퇴자 명단</button>
                                        </div>
                                    </div>

                                    {memberSubTab === 'directory' && (
                                        <div className="animate-fade-in">
                                            <div className="flex justify-end mb-6"><button onClick={() => setIsBulkMode(!isBulkMode)} className={`px-6 py-2.5 rounded-2xl font-black text-sm transition-all flex items-center gap-2 ${isBulkMode ? 'bg-slate-900 text-white shadow-lg' : 'bg-blue-50 text-blue-600'}`}><Icon.FileSpreadsheet size={18}/>{isBulkMode ? '개별 등록' : '대량 등록'}</button></div>
                                            {isBulkMode ? (
                                                <div className="animate-zoom-in text-left text-xs"><textarea className="w-full h-64 p-6 bg-slate-50 rounded-3xl font-bold text-sm border-2 border-transparent focus:border-blue-300 resize-none transition-all outline-none" placeholder="이름, 생일, 성별, 포지션..." value={bulkPasteText} onChange={e => setBulkPasteText(e.target.value)} /><div className="flex justify-end gap-3 mt-6"><button onClick={() => setBulkPasteText('')} className="px-8 py-4 bg-slate-100 text-slate-500 rounded-2xl font-black outline-none border-none">초기화</button><button onClick={handleBulkAdd} className="px-10 py-4 bg-blue-600 text-white rounded-2xl font-black shadow-xl shadow-blue-100 uppercase">Submit Bulk</button></div></div>
                                            ) : (
                                                <div className="grid grid-cols-2 sm:grid-cols-4 gap-6 animate-zoom-in mb-8">
                                                    <div className="flex flex-col gap-1 text-left"><label className="text-[10px] font-black text-slate-400 ml-1 uppercase">Name</label><input type="text" className="p-4 bg-slate-50 rounded-2xl font-black outline-none" value={newMember.name} onChange={e=>setNewMember({...newMember, name: e.target.value})} placeholder="성함" /></div>
                                                    <div className="flex flex-col gap-1 text-left"><label className="text-[10px] font-black text-slate-400 ml-1 uppercase">Birth</label><input type="text" maxLength="8" className="p-4 bg-slate-50 rounded-2xl font-black outline-none" value={newMember.birth} onChange={e=>setNewMember({...newMember, birth: e.target.value.replace(/[^0-9]/g, '')})} placeholder="19900101" /></div>
                                                    <div className="flex flex-col gap-1 text-left"><label className="text-[10px] font-black text-slate-400 ml-1 uppercase">Gender</label><select className="p-4 bg-slate-50 rounded-2xl font-black outline-none" value={newMember.gender} onChange={e=>setNewMember({...newMember, gender: e.target.value, level: e.target.value === '남성' ? '1' : '7'})}><option>남성</option><option>여성</option></select></div>
                                                    <div className="flex flex-col gap-1 text-left"><label className="text-[10px] font-black text-slate-400 ml-1 uppercase">Position</label><select className="p-4 bg-slate-50 rounded-2xl font-black outline-none" value={newMember.position || 'ALL'} onChange={e => setNewMember({...newMember, position: e.target.value})}>{POSITIONS.map(p => <option key={p} value={p}>{p}</option>)}</select></div>
                                                    <div className="sm:col-span-1 flex items-end"><button onClick={handleAddMember} className="w-full h-14 bg-blue-600 text-white rounded-[20px] font-black shadow-xl shadow-blue-100 uppercase text-sm">Register</button></div>
                                                </div>
                                            )}
                                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-5">
                                                {activeMembers.sort((a,b)=>a.name.localeCompare(b.name)).map(m => (
                                                    <div key={m.id} className="bg-white p-4 sm:p-5 rounded-[24px] sm:rounded-[32px] border border-slate-100 shadow-sm relative group hover:shadow-md transition-all text-left">
                                                        <div className="flex items-start gap-3 w-full">
                                                            <div className={`w-12 h-12 sm:w-14 sm:h-14 rounded-full flex items-center justify-center text-lg sm:text-xl font-black shadow-sm shrink-0 mt-0.5 ${getGenderPastelClass(m.gender)}`}>{m.level}</div>
                                                            <div className="flex flex-col flex-1 min-w-0 w-full text-left">
                                                                <div className="flex items-start justify-between w-full mb-2 gap-2 text-left">
                                                                    <h3 className="text-lg sm:text-xl font-black text-slate-900 leading-none mt-1 break-keep text-left">{m.name}</h3>
                                                                    <div className="flex gap-1 shrink-0 bg-slate-50 p-1 rounded-xl border border-slate-100">
                                                                        <button onClick={() => setWithdrawModal({show: true, member: m, date: getTodayString(), reason: '', isForced: false})} className="text-slate-400 hover:text-orange-500 transition-all p-1 bg-white rounded-lg shadow-sm active:scale-95" title="탈퇴"><Icon.UserMinus size={14} /></button>
                                                                        <button onClick={() => setEditingMember({...m})} className="text-slate-400 hover:text-blue-500 transition-all p-1 bg-white rounded-lg shadow-sm active:scale-95" title="수정"><Icon.Edit size={14} /></button>
                                                                        <button onClick={() => showConfirm("회원 삭제", `${m.name} 님의 데이터를 삭제하시겠습니까?`, async () => { await getMemberCol().doc(m.id).delete(); })} className="text-slate-400 hover:text-red-500 transition-all p-1 bg-white rounded-lg shadow-sm active:scale-95" title="삭제"><Icon.Trash size={14} /></button>
                                                                    </div>
                                                                </div>
                                                                <div className="flex items-center gap-1.5 mb-1.5 w-full flex-wrap text-left">
                                                                    <span className={`text-[10px] sm:text-[11px] font-black px-1.5 sm:px-2 py-0.5 rounded-full border ${getPosColorClass(m.position)} shadow-sm leading-none shrink-0`}>{m.position}</span>
                                                                    {m.role && m.role !== '회원' && (<span className={`text-[9px] sm:text-[10px] px-1.5 sm:px-2 py-0.5 rounded-lg font-black ${getRoleBadgeClass(m.role)} shadow-sm uppercase leading-none shrink-0`}>{m.role}</span>)}
                                                                    {m.coupleId && (<span className="inline-flex items-center gap-1 bg-pink-50 text-pink-600 px-1.5 py-0.5 rounded-full text-[9px] sm:text-[10px] font-black border border-pink-100 shadow-sm shrink-0"><Icon.Heart size={10} className="animate-pulse shrink-0"/> {getCoupleName(m.coupleId)}</span>)}
                                                                </div>
                                                                <div className="w-full truncate text-left"><span className="text-[11px] sm:text-[12px] font-black text-slate-600 tracking-wide text-left">{formatBirth(m.birth)}</span></div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}

                                    {memberSubTab === 'monthly' && (
                                        <div className="animate-fade-in">
                                            <div className="flex justify-center items-center gap-4 mb-4"><button onClick={() => moveMonth(-1)} className="p-2 rounded-full hover:bg-slate-100 text-slate-400"><Icon.ChevronRight className="rotate-180" /></button><div className="text-center"><p className="text-xs font-bold text-slate-400 uppercase tracking-widest">Fee Status</p><h2 className="text-2xl font-black text-slate-900">{targetMonth}</h2></div><button onClick={() => moveMonth(1)} className="p-2 rounded-full hover:bg-slate-100 text-slate-400"><Icon.ChevronRight /></button></div>
                                            <div className="flex gap-2 overflow-x-auto pb-4 mb-4 no-scrollbar">
                                                {['all', 'monthly', 'half', 'full', 'rest', 'special', 'unpaid'].map(cat => (<button key={cat} onClick={() => setFilterCategory(cat)} className={`flex-shrink-0 px-3 py-1.5 rounded-full text-[10px] font-black transition-all ${filterCategory === cat ? 'bg-slate-800 text-white' : 'bg-slate-100 text-slate-500'}`}>{cat} <span className="opacity-70 ml-0.5">({filterCounts[cat]})</span></button>))}
                                            </div>
                                            <div className="flex items-center gap-2 overflow-x-auto pb-4 mb-4 no-scrollbar bg-slate-50 p-3 rounded-2xl"><span className="text-[10px] font-black text-slate-400 whitespace-nowrap mr-1 flex items-center gap-1"><Icon.FileSpreadsheet size={12}/> 명단 확인</span>{['unpaid', 'half', 'full', 'rest_all'].map(t => (<button key={t} onClick={() => handleShowListModal(t)} className="flex-shrink-0 px-4 py-2 rounded-full text-[10px] font-black bg-white border border-slate-200 shadow-sm active:scale-95">{t}</button>))}</div>
                                            <div className="flex flex-col space-y-2"><div className="flex items-center px-4 py-2 text-[10px] font-black text-slate-400 uppercase">No. Name / Info / Status</div>{filteredMonthlyMembers.map((m, idx) => (<div key={m.id} className="w-full flex items-center px-4 py-3 rounded-2xl border bg-white shadow-sm"><div className="w-10 font-bold">{idx + 1}</div><button onClick={() => !STAFF_ROLES.includes(m.role) && setSelectedMonthlyMember(m)} className="flex-1 text-left"><span className="text-base font-black">{m.name}</span></button></div>))}</div>
                                        </div>
                                    )}

                                    {memberSubTab === 'withdrawn' && (
                                        <div className="animate-fade-in"><div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">{withdrawnMembers.map(m => (<div key={m.id} className="bg-slate-50 p-6 rounded-[32px] border border-slate-200 text-left"><div className="flex items-start justify-between"><div><h3 className="text-xl font-black text-slate-700 text-left">{m.name}</h3><p className="text-[11px] text-slate-500 text-left">탈퇴일자: {m.withdrawnDate}</p></div><button onClick={() => handleRestore(m)} className="text-[11px] bg-white border border-slate-200 px-3 py-1.5 rounded-xl font-bold">복구</button></div></div>))}</div></div>
                                    )}
                                </div>
                            </div>
                        )}

                        {view === 'settings' && (
                            <div className="max-w-xl mx-auto pb-24 text-left animate-zoom-in">
                                <div className="bg-white p-8 rounded-[48px] shadow-sm border border-slate-100 text-center"><h2 className="text-3xl font-black text-slate-900 mb-8 flex items-center justify-center gap-3"><Icon.Settings size={32} className="text-slate-300" />Settings</h2><div className="mb-10"><h3 className="text-lg font-black text-slate-700 mb-4">폰트 파일 업로드</h3><input type="file" accept=".ttf,.otf,.woff" multiple className="hidden" id="font-upload" onChange={handleFontUpload} /><label htmlFor="font-upload" className="block w-full h-40 border-4 border-dashed border-slate-100 rounded-[32px] flex flex-col items-center justify-center cursor-pointer hover:border-blue-200 hover:bg-blue-50 transition-all shadow-none"><Icon.Upload size={32}/><span className="font-black text-slate-400 text-sm mt-3">Click to Upload Font</span></label></div></div>
                            </div>
                        )}
                    </main>

                    {/* 로그인 모달 */}
                    {isLoginModalOpen && (
                        <div className="fixed inset-0 bg-slate-900/90 backdrop-blur-xl z-[9000] flex items-center justify-center p-4">
                            <div className="bg-white rounded-[48px] w-full max-w-md p-10 shadow-2xl animate-zoom-in text-center border-2 border-blue-50">
                                <div className="w-20 h-20 bg-blue-600 rounded-3xl flex items-center justify-center mx-auto mb-8 text-white"><Icon.ShieldCheck size={40} /></div>
                                <h2 className="text-3xl font-black text-slate-900 mb-8">Admin Login</h2>
                                <div className="grid grid-cols-2 gap-2 max-h-48 overflow-y-auto custom-scrollbar mb-8">
                                    {managers.map(m => (<button key={m.id} onClick={() => setLoginForm({ ...loginForm, name: m.name })} className={`p-3 rounded-2xl border-2 ${loginForm.name === m.name ? 'border-blue-500 bg-blue-50' : 'border-slate-100 bg-slate-50'}`}><span className="font-black text-sm">{m.name}</span></button>))}
                                </div>
                                <button onClick={handleLogin} disabled={!loginForm.name} className={`w-full py-5 rounded-3xl font-black text-xl shadow-xl transition-all ${loginForm.name ? 'bg-blue-600 text-white' : 'bg-slate-200 text-slate-400'}`}>Login</button>
                            </div>
                        </div>
                    )}
                    
                    {withdrawModal.show && (
                        <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-md z-[6000] flex items-center justify-center p-4" onClick={() => setWithdrawModal({...withdrawModal, show: false})}>
                            <div className="bg-white rounded-[48px] w-full max-w-sm p-10 shadow-2xl text-left" onClick={e => e.stopPropagation()}>
                                <h2 className="text-2xl font-black mb-8 text-orange-600">회원 탈퇴 처리</h2>
                                <div className="space-y-4 mb-10 text-xs">
                                    <div className="flex flex-col gap-1"><label className="text-[10px] font-black text-slate-400 ml-1 uppercase">Name</label><div className="p-4 bg-slate-50 rounded-2xl font-black text-slate-800 text-sm border border-slate-100">{withdrawModal.member?.name}</div></div>
                                    <div className="flex flex-col gap-1"><label className="text-[10px] font-black text-slate-400 ml-1 uppercase">Date</label><input type="date" className="p-4 bg-slate-50 rounded-2xl font-black outline-none" value={withdrawModal.date} onChange={e => setWithdrawModal({...withdrawModal, date: e.target.value})} /></div>
                                    <div className="flex flex-col gap-1"><label className="text-[10px] font-black text-slate-400 ml-1 uppercase">Reason</label><input type="text" placeholder="사유 입력" className="p-4 bg-slate-50 rounded-2xl font-black outline-none" value={withdrawModal.reason} onChange={e => setWithdrawModal({...withdrawModal, reason: e.target.value})} /></div>
                                    <div className={`flex items-center gap-3 mt-4 p-4 rounded-2xl border cursor-pointer ${withdrawModal.isForced ? 'bg-red-50 border-red-200' : 'bg-slate-50 border-slate-200'}`} onClick={() => setWithdrawModal({...withdrawModal, isForced: !withdrawModal.isForced})}>
                                        <div className={`w-5 h-5 rounded flex items-center justify-center ${withdrawModal.isForced ? 'bg-red-500 text-white' : 'bg-white border-2 border-slate-300'}`}>{withdrawModal.isForced && <Icon.Check size={14}/>}</div>
                                        <div className="flex flex-col"><span className={`text-xs font-black ${withdrawModal.isForced ? 'text-red-600' : 'text-slate-600'}`}>강제 탈퇴 (블랙리스트)</span><span className="text-[9px] text-slate-400 font-bold">체크 시 6개월 간 재가입 불가 표시</span></div>
                                    </div>
                                </div>
                                <div className="flex gap-3"><button onClick={() => setWithdrawModal({...withdrawModal, show: false})} className="flex-1 py-5 bg-slate-100 text-slate-500 rounded-3xl font-black">취소</button><button onClick={handleWithdraw} className="flex-1 py-5 bg-orange-600 text-white rounded-3xl font-black shadow-xl">탈퇴 확정</button></div>
                            </div>
                        </div>
                    )}

                    {listModalData && (
                        <div className={`fixed inset-0 bg-slate-900/80 backdrop-blur-md z-[8000] flex justify-center p-4 ${isCapturing ? 'items-start overflow-y-auto py-10' : 'items-center'}`} onClick={() => { if(!isCapturing) { setListModalData(null); setCapturedImage(null); } }}>
                            <div className={`bg-white w-full max-w-sm shadow-2xl flex flex-col ${isCapturing || capturedImage ? 'rounded-[40px] h-auto' : 'rounded-[40px] overflow-hidden max-h-[80vh] animate-zoom-in'}`} onClick={e => e.stopPropagation()}>
                                {capturedImage ? (
                                    <div className="flex flex-col items-center"><div className="bg-slate-100 p-4 rounded-t-[40px] w-full text-center border-b border-slate-200"><p className="text-sm font-black text-slate-800">📸 이미지 생성 완료!</p><p className="text-[10px] text-slate-500 mt-1">모바일은 아래 이미지를 <b>길게 눌러 저장</b>하세요.</p></div><div className="p-4 w-full overflow-y-auto max-h-[60vh] bg-slate-50 flex justify-center"><img src={capturedImage} alt="Captured List" className="w-full rounded-2xl shadow-sm border border-slate-200" /></div><div className="p-4 bg-white w-full border-t border-slate-100 flex gap-2 rounded-b-[40px]"><button onClick={() => setCapturedImage(null)} className="flex-1 py-3 bg-slate-100 text-slate-600 rounded-2xl font-black text-xs">다시 보기</button><button onClick={handleDownloadImage} className="flex-[2] py-3 bg-blue-600 text-white rounded-2xl font-black text-xs flex items-center justify-center gap-1.5"><Icon.Save size={14}/> PC 다운로드</button></div></div>
                                ) : (
                                    <><div id="capture-area" className="bg-white flex flex-col w-full rounded-[40px] overflow-hidden"><div className="p-6 bg-slate-900 text-white text-center"><h3 className="text-xl font-black mb-1">{listModalData.title}</h3><p className="text-xs font-bold text-slate-400 uppercase tracking-widest">Total {listModalData.count} Members</p></div><div className={`p-6 bg-white flex-1 ${isCapturing ? '' : 'overflow-y-auto custom-scrollbar'}`}><div className="flex flex-col space-y-1">{listModalData.items.map((item, idx) => (<div key={item.id || idx} className="flex justify-between items-center py-2.5 border-b border-slate-100 last:border-0"><div className="flex items-center gap-2"><span className="text-sm font-black text-slate-800">{item.name}</span>{item.tag && (<span className="text-[9px] px-1.5 py-0.5 rounded bg-slate-100 text-slate-600 font-bold border border-slate-200">{item.tag}</span>)}</div>{item.details && (<span className="text-[10px] text-slate-500 font-bold text-right">{item.details}</span>)}</div>))}</div>{isCapturing && (<div className="mt-8 text-center text-slate-300 font-black text-[9px] uppercase tracking-widest">OTP FC Attendance System</div>)}</div></div>{!isCapturing && (<div className="p-4 bg-slate-50 border-t border-slate-100 flex flex-col gap-2 rounded-b-[40px]"><button onClick={handleCaptureImage} className="w-full py-4 bg-blue-600 text-white rounded-2xl font-black shadow-md active:scale-95 text-sm flex items-center justify-center gap-2"><Icon.Save size={16}/> 이 화면을 이미지로 저장</button><div className="flex gap-2"><button onClick={() => { setListModalData(null); setCapturedImage(null); }} className="flex-1 py-3 bg-white border border-slate-200 text-slate-500 rounded-2xl font-black text-xs">닫기</button><button onClick={handleCopyFromModal} className="flex-1 py-3 bg-slate-800 text-white rounded-2xl font-black text-xs flex items-center justify-center gap-1.5"><Icon.FileSpreadsheet size={14}/> 텍스트 복사</button></div></div>)}</>
                                )}
                            </div>
                        </div>
                    )}
                    
                    {alertModal.show && (
                        <div className="fixed inset-0 bg-slate-900/90 backdrop-blur-md z-[9999] flex items-center justify-center p-4" onClick={() => setAlertModal(p => ({...p, show: false}))}>
                            <div className="bg-white rounded-[48px] w-full max-w-sm p-10 shadow-2xl text-center animate-zoom-in" onClick={e => e.stopPropagation()}><h3 className="text-2xl font-black mb-4 uppercase text-slate-900">{alertModal.title}</h3><p className="text-slate-500 font-bold mb-10 whitespace-pre-wrap leading-relaxed text-sm">{alertModal.content}</p><div className="flex gap-3">{alertModal.type === 'confirm' && <button onClick={() => setAlertModal(p => ({...p, show: false}))} className="flex-1 py-5 bg-slate-100 text-slate-500 rounded-3xl font-black active:scale-95 border-none shadow-none uppercase text-xs">No</button>}<button onClick={() => { if (alertModal.onConfirm) alertModal.onConfirm(); setAlertModal(p => ({...p, show: false})); }} className={`flex-1 py-5 text-white rounded-3xl font-black shadow-xl active:scale-95 ${alertModal.type === 'confirm' ? 'bg-blue-600 shadow-blue-100' : 'bg-slate-900 shadow-slate-200'} uppercase text-xs`}>Yes</button></div></div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
